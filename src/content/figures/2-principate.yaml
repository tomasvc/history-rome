- id: nero
  name: Nero
  full: Lucius Domitius Ahenobarbus, later Nero Claudius Caesar Augustus Germanicus
  born: {from: 37}
  died: {from: 68}
  category: ruler
  roles: [emperor AD 54–68]
  dynasty: Julio-Claudian
  summary: The last Julio-Claudian, remembered as matricide, artist-emperor and persecutor of Christians after the Great Fire of 64; his fall in 68 opened a year of civil war.
  bio: >-
    Guided at first by Seneca and the prefect Burrus, Nero's early reign was praised. After killing his mother (59) and
    divorcing and executing his wife Octavia (62), he pursued performance as singer and charioteer. The fire of 64 destroyed
    much of Rome; Nero blamed the Christians and built his Golden House on the burnt land. The Pisonian conspiracy (65)
    brought executions, including Seneca's suicide. Revolt in Gaul (Vindex) and Spain (Galba) in 68 led the Senate to
    declare him a public enemy, and he killed himself.
  evidence: >-
    Tacitus Annals 13–16, Suetonius and Dio are hostile senatorial sources. Champlin argues that Nero had a coherent
    popular programme; the appearance of several "false Neros" claiming the throne after his death shows his popularity in
    the East.
  relations:
    - {to: agrippina-younger, type: parent}
    - {to: claudius, type: adoptive-parent}
    - {to: seneca, type: teacher}
    - {to: galba, type: successor}
- id: seneca
  name: Seneca
  full: Lucius Annaeus Seneca
  born: {from: -4, circa: true}
  died: {from: 65}
  category: writer
  roles: [philosopher, Nero's adviser]
  summary: Stoic philosopher, playwright and Nero's tutor and minister, forced to suicide after the Pisonian conspiracy.
  bio: >-
    From Corduba in Spain, Seneca was exiled by Claudius and recalled by Agrippina to teach Nero. With Burrus he guided the
    early reign and grew immensely rich, a contradiction critics noted. His Letters to Lucilius and moral essays are central
    texts of Roman Stoicism.
  evidence: His own works; Tacitus' account of his death (Annals 15.60–64).
  relations:
    - {to: nero, type: teacher, note: 'Seneca taught Nero (recorded on Nero''s entry as Nero''s teacher).'}
- id: boudica
  name: Boudica
  died: {from: 61, circa: true, note: 'The revolt is dated AD 60 or 61.'}
  category: foreign
  roles: [queen of the Iceni, rebel leader]
  summary: Queen of the Iceni in Britain who led a revolt in AD 60/61 that destroyed Camulodunum, Londinium and Verulamium before defeat by the governor Suetonius Paulinus.
  bio: >-
    After the death of her husband Prasutagus, a client king, Roman officials seized his kingdom, flogged Boudica and raped
    her daughters, according to Tacitus. The revolt drew in the Trinovantes, angered by the veteran colony at Camulodunum.
    Tens of thousands died before the rebels were defeated somewhere in the Midlands.
  evidence: Tacitus (Agricola and Annals 14) and Dio; burnt destruction layers in Colchester, London and St Albans confirm the scale.
- id: galba
  name: Galba
  full: Servius Sulpicius Galba
  born: {from: -3}
  died: {from: 69, label: '15 January 69'}
  category: ruler
  roles: [emperor 68–69]
  summary: Aged aristocratic governor of Spain proclaimed emperor in 68, murdered in Rome by the Praetorians in January 69 after refusing them a donative.
  bio: >-
    Galba's strictness and his refusal to pay the Guard the promised bonus ("I choose soldiers, I do not buy them") cost him
    their loyalty. His adoption of Piso Licinianus offended Otho, who had expected to be heir, and Otho's conspirators killed
    both men in the Forum.
  evidence: Tacitus Histories 1; Plutarch's Lives of Galba and Otho; Suetonius.
  relations:
    - {to: otho, type: killed}
- id: otho
  name: Otho
  full: Marcus Salvius Otho
  born: {from: 32}
  died: {from: 69, label: 'April 69'}
  category: ruler
  roles: [emperor 69]
  summary: Former friend of Nero who seized power by murdering Galba and killed himself after his army was defeated by Vitellius' at the first battle of Bedriacum.
  bio: >-
    Otho reigned for three months. Defeated near Cremona, he chose suicide to spare further civil war, a death even hostile
    writers admired.
  evidence: Tacitus Histories 1–2; Plutarch; Suetonius.
  relations:
    - {to: galba, type: rival}
    - {to: vitellius, type: rival}
- id: vitellius
  name: Vitellius
  full: Aulus Vitellius
  born: {from: 15}
  died: {from: 69, label: 'December 69'}
  category: ruler
  roles: [emperor 69]
  summary: Commander of the Rhine armies, who were the first to march on Rome in 69; defeated by Vespasian's Danubian legions and killed in Rome.
  bio: >-
    Proclaimed by the legions of Lower Germany in January 69, Vitellius won Italy at Bedriacum. The Danubian and eastern
    armies then backed Vespasian; Antonius Primus defeated the Vitellians at the second battle of Bedriacum, sacked Cremona,
    and took Rome after street fighting in which the Capitoline temple burned. Vitellius was dragged through the city and
    killed.
  evidence: Tacitus Histories 2–3, Suetonius; Flavian propaganda made him gluttonous and incompetent.
  relations:
    - {to: otho, type: rival}
    - {to: vespasian, type: rival}
- id: vespasian
  name: Vespasian
  full: Titus Flavius Vespasianus
  born: {from: 9}
  died: {from: 79}
  category: ruler
  roles: [general, emperor 69–79]
  dynasty: Flavian
  summary: An Italian equestrian's son, commander in the Jewish War, who won the civil war of 69, restored the finances and founded the Flavian dynasty.
  bio: >-
    Vespasian served in the invasion of Britain and was given the Judaean command in 67. Acclaimed in Alexandria in July 69,
    he held Egypt's grain while his allies won Italy. As emperor he rebuilt the Capitol, began the Colosseum on the site of
    Nero's lake, raised taxes, and named his sons Titus and Domitian as successors. His powers were set out in a law, part of
    which survives on bronze. His deathbed joke, "I think I am becoming a god", shows his reputation for dry humour.
  evidence: Tacitus Histories; Suetonius; Josephus, who had prophesied his rule; the lex de imperio Vespasiani.
  relations:
    - {to: titus, type: parent}
    - {to: domitian, type: parent}
    - {to: vitellius, type: rival}
    - {to: josephus, type: patron}
  sources: [lex-de-imperio, tacitus-histories-1-4]
- id: titus
  name: Titus
  full: Titus Flavius Vespasianus
  born: {from: 39}
  died: {from: 81}
  category: ruler
  roles: [general, emperor 79–81]
  dynasty: Flavian
  summary: Vespasian's elder son, who captured Jerusalem in 70 and destroyed the Temple; his brief reign saw the eruption of Vesuvius and the opening of the Colosseum.
  bio: >-
    Titus completed the Jewish War with the siege of Jerusalem (70), commemorated by the Arch of Titus. As emperor he
    responded to the eruption of Vesuvius (79) and a fire in Rome, and inaugurated the Flavian Amphitheatre with 100 days of
    games. He died in 81, remembered as "the delight of the human race".
  evidence: Suetonius; Josephus' Jewish War; Dio; the Arch of Titus.
  relations:
    - {to: vespasian, type: parent}
    - {to: domitian, type: sibling}
  sources: [arch-of-titus]
- id: domitian
  name: Domitian
  full: Titus Flavius Domitianus
  born: {from: 51}
  died: {from: 96}
  category: ruler
  roles: [emperor 81–96]
  dynasty: Flavian
  summary: Younger son of Vespasian whose authoritarian reign alienated the Senate; assassinated in 96 and condemned to memory sanctions.
  bio: >-
    Domitian governed actively: he raised army pay, campaigned against the Chatti and Dacians, revalued the coinage and
    supervised governors closely. He styled himself "lord and god" (dominus et deus) according to hostile writers, and after
    the revolt of Saturninus (89) treason trials and executions increased. Courtiers including his wife arranged his murder
    in 96; the Senate ordered his name erased.
  evidence: >-
    Tacitus' Agricola, Pliny's Panegyricus, Suetonius and Juvenal wrote after his death under emperors who defined
    themselves against him. Inscriptions and coins show an energetic administration.
  relations:
    - {to: vespasian, type: parent}
    - {to: titus, type: sibling}
    - {to: agricola, type: rival}
- id: josephus
  name: Josephus
  full: Titus Flavius Josephus (Yosef ben Matityahu)
  born: {from: 37}
  died: {from: 100, circa: true}
  category: writer
  roles: [historian, Jewish commander]
  summary: Jewish priest and commander in Galilee who surrendered to Vespasian, prophesied his rule, and wrote the Jewish War and Jewish Antiquities in Rome.
  bio: >-
    Captured at Jotapata in 67, Josephus became a client of the Flavians and witnessed the siege of Jerusalem from the Roman
    camp. His histories defended both his own conduct and the Jewish people to Greek-speaking readers, blaming the war on a
    minority of rebels.
  evidence: His own works, including an autobiography (Life); a uniquely detailed but self-justifying narrative.
  relations:
    - {to: vespasian, type: patron}
- id: agricola
  name: Agricola
  full: Gnaeus Julius Agricola
  born: {from: 40}
  died: {from: 93}
  category: general
  roles: [governor of Britain 77/78–83/84]
  summary: Governor of Britain who campaigned into Scotland and won at Mons Graupius; known chiefly through his son-in-law Tacitus' biography.
  bio: >-
    From Forum Iulii in Gaul, Agricola served in Britain three times. As governor he encouraged towns, baths and Latin
    education among British elites, and pushed north to Mons Graupius (83 or 84). Recalled by Domitian, he lived quietly
    until his death in 93.
  evidence: Tacitus' Agricola, a eulogy with political purpose; a fragmentary inscription from Verulamium (St Albans) bearing his name; archaeology of the Scottish campaigns.
  relations:
    - {to: tacitus, type: other-family, note: 'Tacitus married Agricola''s daughter.'}
    - {to: domitian, type: rival}
  sources: [tacitus-agricola]
- id: tacitus
  name: Tacitus
  full: Publius (or Gaius) Cornelius Tacitus
  born: {from: 56, circa: true}
  died: {from: 120, circa: true}
  category: writer
  roles: [historian, senator, consul 97]
  summary: The greatest Roman historian, a senator who served under Domitian and wrote the Histories and Annals, bitter and brilliant analyses of the Principate.
  bio: >-
    Tacitus' career prospered under the Flavians, including Domitian, a complicity he reflects on in the Agricola. He was
    consul in 97 and governor of Asia c. 112. His Annals (AD 14–68) and Histories (69–96) survive in part. His subject is the
    loss of liberty and the corruption of a senatorial class adapting to monarchy; his method combines careful use of senate
    records with insinuation, irony and selection.
  evidence: His works; Pliny's letters to him; an inscription from Mylasa referring to his proconsulship.
  relations:
    - {to: agricola, type: other-family}
    - {to: pliny-younger, type: ally}
  sources: [tacitus-annals-1, tacitus-histories-1-4, tacitus-agricola, claudius-gauls]
- id: suetonius
  name: Suetonius
  full: Gaius Suetonius Tranquillus
  born: {from: 70, circa: true}
  died: {from: 130, circa: true}
  category: writer
  roles: [biographer, imperial secretary]
  summary: Equestrian scholar and secretary to Hadrian who wrote the Lives of the Caesars, organising each emperor's life by topic.
  bio: >-
    A protégé of Pliny, Suetonius ran the imperial libraries and correspondence under Trajan and Hadrian before dismissal in
    122. His Caesars quote documents and letters he had seen in the archives, alongside gossip; he structures lives by
    categories of virtues and vices rather than narrative.
  evidence: His own works; Pliny's letters; an inscription from Hippo Regius recording his career.
  relations:
    - {to: pliny-younger, type: patron}
- id: pliny-younger
  name: Pliny the Younger
  full: Gaius Plinius Caecilius Secundus
  born: {from: 61}
  died: {from: 113, circa: true}
  category: politician
  roles: [senator, consul 100, governor of Bithynia-Pontus]
  summary: Senator, lawyer and letter-writer whose ten books of letters, including his correspondence as governor with Trajan, illuminate elite life and provincial government.
  bio: >-
    Nephew and adopted son of the encyclopedist Pliny the Elder (who died in the eruption of Vesuvius, described in two
    letters to Tacitus), Pliny had a conventional senatorial career and delivered the Panegyricus in praise of Trajan as
    consul in 100. Around 110 Trajan sent him as special governor to Bithynia-Pontus to sort out city finances; Book 10
    preserves his queries and Trajan's replies, including on the Christians.
  evidence: His Letters and Panegyricus; inscriptions from Comum recording his benefactions.
  relations:
    - {to: trajan, type: patron}
    - {to: tacitus, type: ally}
    - {to: suetonius, type: patron, note: 'Recorded on Suetonius'' entry: Pliny was his patron.'}
  sources: [pliny-christians, pliny-fire-brigade]
- id: trajan
  name: Trajan
  full: Marcus Ulpius Traianus
  born: {from: 53}
  died: {from: 117}
  category: ruler
  roles: [emperor 98–117]
  dynasty: Nerva-Antonine
  summary: The first emperor from a province (Spain), adopted by Nerva, who conquered Dacia and briefly Mesopotamia and was remembered as "the best ruler" (optimus princeps).
  bio: >-
    Adopted by the elderly Nerva in 97 under pressure from the Guard, Trajan reached Rome only in 99. He won two Dacian wars
    (101–102, 105–106), annexing Dacia and its gold mines, and annexed Arabia (106). His Forum and Column celebrated the
    Dacian victories, and the alimenta schemes supported children in Italian towns. In 114–117 he conquered Armenia and
    Mesopotamia to the Persian Gulf, but revolts, including the Jewish diaspora revolt, broke out, and he died in Cilicia on
    the way home.
  evidence: Dio's account survives in Byzantine summaries; Pliny's Panegyricus and letters; Trajan's Column; inscriptions and coins.
  relations:
    - {to: hadrian, type: successor, note: 'Hadrian claimed a deathbed adoption that contemporaries doubted.'}
    - {to: pliny-younger, type: patron}
- id: hadrian
  name: Hadrian
  full: Publius Aelius Hadrianus
  born: {from: 76}
  died: {from: 138}
  category: ruler
  roles: [emperor 117–138]
  dynasty: Nerva-Antonine
  summary: Trajan's cousin and successor who abandoned Mesopotamia, built frontier walls, toured the provinces and crushed the Bar Kokhba revolt.
  bio: >-
    Hadrian's accession on a disputed adoption was followed by the execution of four consulars. He gave up Trajan's eastern
    conquests and spent years travelling the provinces, inspecting armies, founding cities and building, from the Wall in
    Britain to the Pantheon and his villa at Tibur. A philhellene, he founded the Panhellenion. His plan to refound
    Jerusalem as Aelia Capitolina helped provoke the Bar Kokhba revolt (132–135/6), suppressed with great loss of life. He
    adopted Antoninus on condition that he adopt Marcus Aurelius and Lucius Verus.
  evidence: The Historia Augusta life (more reliable than most in that collection), Dio's summarised Book 69, inscriptions, coins recording his travels, and the monuments themselves.
  relations:
    - {to: trajan, type: adoptive-parent}
    - {to: antoninus-pius, type: successor}
- id: antoninus-pius
  name: Antoninus Pius
  full: Titus Aurelius Fulvus Boionius Arrius Antoninus
  born: {from: 86}
  died: {from: 161}
  category: ruler
  roles: [emperor 138–161]
  dynasty: Nerva-Antonine
  summary: Emperor whose long, peaceful reign was spent almost entirely in Italy; he advanced the frontier in Britain with the Antonine Wall.
  bio: >-
    Antoninus earned his name Pius by insisting on Hadrian's deification. He governed from Rome through correspondence,
    accumulated a large surplus, and pushed the British frontier north to the Forth–Clyde line. The calm of his reign
    impressed later writers; the problems of the next decades may have been building.
  evidence: The brief Historia Augusta life, inscriptions, legal texts and coins; Marcus Aurelius' tribute in Meditations 1.16.
  relations:
    - {to: hadrian, type: adoptive-parent}
    - {to: marcus-aurelius, type: successor}
- id: marcus-aurelius
  name: Marcus Aurelius
  full: Marcus Aurelius Antoninus
  born: {from: 121}
  died: {from: 180}
  category: ruler
  roles: [emperor 161–180, philosopher]
  dynasty: Nerva-Antonine
  summary: Philosopher-emperor whose reign was dominated by the Parthian war, the Antonine Plague and the Marcomannic wars on the Danube; he named his son Commodus as successor.
  bio: >-
    Marcus ruled jointly with Lucius Verus until 169, the first time two emperors shared power. Verus' Parthian war
    (161–166) coincided with the outbreak of a pandemic carried west by the army. From 167 Germanic and Sarmatian peoples
    crossed the Danube and even reached Italy; Marcus spent most of the rest of his life on campaign, writing the Stoic
    notebook we call the Meditations. In 175 the eastern governor Avidius Cassius revolted on a false report of his death.
    Marcus made Commodus co-emperor in 177 and died on campaign in 180.
  evidence: His Meditations and correspondence with Fronto; Dio's summarised account; the Historia Augusta; the Column of Marcus Aurelius; his equestrian statue on the Capitol.
  relations:
    - {to: antoninus-pius, type: adoptive-parent}
    - {to: lucius-verus, type: colleague}
    - {to: commodus, type: parent}
    - {to: galen, type: patron}
  sources: []
- id: lucius-verus
  name: Lucius Verus
  born: {from: 130}
  died: {from: 169}
  category: ruler
  roles: [co-emperor 161–169]
  dynasty: Nerva-Antonine
  summary: Marcus Aurelius' adoptive brother and co-emperor, nominal commander in the Parthian war of 161–166.
  bio: Verus' generals, notably Avidius Cassius, sacked Seleucia and Ctesiphon. The returning army was associated with the spread of the plague. Verus died in 169.
  evidence: Historia Augusta; Fronto's letters; coins.
  relations:
    - {to: marcus-aurelius, type: colleague}
- id: commodus
  name: Commodus
  full: Lucius Aurelius Commodus
  born: {from: 161}
  died: {from: 192, label: '31 December 192'}
  category: ruler
  roles: [emperor 180–192]
  dynasty: Nerva-Antonine
  summary: Marcus' son, the first emperor "born in the purple" since Titus, who made peace on the Danube, fought as a gladiator, identified himself with Hercules and was strangled in 192.
  bio: >-
    Commodus ended his father's wars by treaty and left government to favourites. After a conspiracy involving his sister in
    182 he grew suspicious. He fought in the arena and renamed Rome after himself. His murder by courtiers opened a new
    period of civil war.
  evidence: Dio, a senator who watched Commodus in the arena; Herodian; Historia Augusta.
  relations:
    - {to: marcus-aurelius, type: parent}
- id: galen
  name: Galen
  full: Galen of Pergamum
  born: {from: 129}
  died: {from: 216, circa: true}
  category: writer
  roles: [physician]
  summary: The most influential physician of antiquity, doctor to Marcus Aurelius, whose descriptions are our main medical evidence for the Antonine Plague.
  bio: Galen trained in Pergamum and Alexandria, treated gladiators, and practised at Rome. His enormous output shaped medicine for over a thousand years. His descriptions of the "great plague" suggest a smallpox-like disease, though he never gives a full clinical account.
  evidence: His surviving works, many partly autobiographical.
  relations:
    - {to: marcus-aurelius, type: patron}
- id: cassius-dio
  name: Cassius Dio
  full: Lucius Cassius Dio
  born: {from: 164, circa: true}
  died: {from: 235, circa: true}
  category: writer
  roles: [historian, senator, consul 229]
  summary: Greek-speaking senator from Nicaea whose 80-book Roman History, partly surviving, is crucial for the late Republic, Augustus and his own Severan age.
  bio: Dio served under Commodus, the Severans and Severus Alexander, holding a second consulship with the emperor in 229. He narrated contemporary events as an eyewitness and Augustus' settlement through the speeches of Agrippa and Maecenas (Book 52), a debate on monarchy.
  evidence: His History, complete for 69 BC–AD 46 and otherwise in Byzantine excerpts and summaries.
  sources: [dio-severus]
