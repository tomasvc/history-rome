- id: augustus
  name: Augustus
  full: Gaius Octavius, later Gaius Julius Caesar Octavianus, then Imperator Caesar Augustus
  born: {from: -63, label: '23 September 63 BC'}
  died: {from: 14, label: '19 August AD 14'}
  category: ruler
  roles: [triumvir, first emperor]
  dynasty: Julio-Claudian
  image: prima-porta
  summary: Caesar's great-nephew and adopted heir, who won the civil wars and spent forty years building a monarchy that presented itself as the restored Republic.
  bio: >-
    Adopted in Caesar's will at eighteen, Octavian raised a private army, allied with and then against the Senate, and formed
    the Second Triumvirate with Antony and Lepidus in 43 BC, with proscriptions that killed Cicero. Victory at Philippi (42),
    the defeat of Sextus Pompeius (36), the removal of Lepidus and finally Actium (31) and the capture of Egypt (30) left
    him sole master. In January 27 he "transferred the state to the Senate and People" and received the name Augustus; he
    kept command of the provinces with most of the legions. In 23 BC he gave up the consulship for tribunician power and
    superior proconsular imperium. Over four decades he professionalised the army, settled veterans, reorganised Rome,
    legislated on marriage and morals, built on a vast scale and placed his image everywhere. His succession plans failed
    repeatedly through deaths, until he adopted Tiberius in AD 4.
  evidence: >-
    His own Res Gestae, inscribed at his mausoleum and copied in Galatia; coins, inscriptions and monuments in great numbers;
    Suetonius' Life, Dio Books 45–56 and Tacitus' bleak summary in Annals 1. Velleius Paterculus wrote under Tiberius as an
    admirer. The difficulty is less the lack of evidence than its official character.
  relations:
    - {to: caesar, type: adoptive-parent}
    - {to: octavia, type: sibling}
    - {to: livia, type: spouse}
    - {to: julia-elder, type: parent}
    - {to: agrippa, type: ally, note: 'His closest general and from 21 BC his son-in-law.'}
    - {to: mark-antony, type: rival}
    - {to: tiberius, type: adoptive-parent, note: 'Recorded on Tiberius'' entry: adopted AD 4.'}
    - {to: cleopatra, type: rival}
  sources: [res-gestae, tacitus-annals-1, aegypto-capta, prima-porta]
- id: livia
  name: Livia
  full: Livia Drusilla, later Julia Augusta
  born: {from: -58}
  died: {from: 29}
  category: woman
  roles: [wife of Augustus, Augusta]
  dynasty: Julio-Claudian
  summary: Wife of Augustus for over fifty years and mother of Tiberius, who exercised great informal influence and became Julia Augusta by Augustus' will.
  bio: >-
    Livia divorced Tiberius Claudius Nero, while pregnant with her second son Drusus, to marry Octavian in 38 BC. She
    managed great estates, patronised clients and cities, and was honoured with statues and, unusually, the right to manage
    her own affairs. Augustus adopted her into the Julian family in his will. Tacitus and Dio insinuate that she poisoned
    rivals to secure Tiberius' succession; there is no good evidence for this.
  evidence: Hostile insinuation in Tacitus; honorific inscriptions and portraits; her villa at Prima Porta with its garden fresco.
  relations:
    - {to: augustus, type: spouse}
    - {to: tiberius, type: parent, note: 'Recorded on Tiberius'' entry.'}
- id: octavia
  name: Octavia
  full: Octavia Minor
  born: {from: -69, circa: true}
  died: {from: -11}
  category: woman
  roles: [sister of Augustus]
  dynasty: Julio-Claudian
  summary: Augustus' sister, married to Antony in 40 BC as a peace pledge, mother of Marcellus and of the two Antonias, and an exemplar of the virtuous matron in Augustan ideology.
  bio: >-
    Octavia's marriage to Antony sealed the Pact of Brundisium. Antony's abandonment of her for Cleopatra became a theme of
    Octavian's propaganda. She raised Antony's children, including those by Fulvia and Cleopatra, and through her daughters
    Antonia the Elder and Younger she was ancestor of Claudius, Caligula and Nero.
  evidence: Plutarch's Life of Antony; Dio; honorific inscriptions and the Porticus Octaviae.
  relations:
    - {to: augustus, type: sibling}
    - {to: mark-antony, type: spouse}
- id: agrippa
  name: Agrippa
  full: Marcus Vipsanius Agrippa
  born: {from: -63, circa: true}
  died: {from: -12}
  category: general
  roles: [general, consul three times, builder]
  dynasty: Julio-Claudian
  summary: Augustus' indispensable general, victor at Naulochus and Actium, builder of the first Pantheon and Rome's water system, and from 21 BC his son-in-law and designated partner.
  bio: >-
    A man of obscure family and Octavian's friend from youth, Agrippa commanded the fleets that beat Sextus Pompeius and
    Antony. As aedile in 33 BC he renovated Rome's aqueducts and sewers. Married to Julia in 21, he received tribunician
    power and imperium, and their sons Gaius and Lucius were adopted by Augustus as heirs. His death in 12 BC was a severe
    blow to the succession plan.
  evidence: Dio; inscriptions (the Pantheon still bears his name); Pliny the Elder on his map of the world.
  relations:
    - {to: augustus, type: ally}
    - {to: julia-elder, type: spouse}
    - {to: agrippina-elder, type: parent, note: 'Recorded on Agrippina''s entry.'}
- id: julia-elder
  name: Julia (daughter of Augustus)
  born: {from: -39}
  died: {from: 14}
  category: woman
  roles: [daughter of Augustus]
  dynasty: Julio-Claudian
  summary: Augustus' only child, married successively to Marcellus, Agrippa and Tiberius to serve his dynastic plans, then exiled in 2 BC for adultery.
  bio: >-
    Julia's marriages carried the succession: her sons by Agrippa, Gaius and Lucius, were adopted as Augustus' heirs. Her
    exile in 2 BC for adultery with several aristocrats, including Antony's son Iullus Antonius, may have had a political
    dimension. She died in exile shortly after Augustus.
  evidence: Seneca, Velleius, Suetonius, Macrobius' collection of her witticisms; the political reading of her fall is modern inference.
  relations:
    - {to: augustus, type: parent}
    - {to: agrippa, type: spouse}
    - {to: tiberius, type: spouse}
    - {to: agrippina-elder, type: parent, note: 'Recorded on Agrippina''s entry.'}
- id: tiberius
  name: Tiberius
  full: Tiberius Claudius Nero, later Tiberius Julius Caesar Augustus
  born: {from: -42}
  died: {from: 37}
  category: ruler
  roles: [general, emperor AD 14–37]
  dynasty: Julio-Claudian
  summary: Livia's son, Rome's best general of his generation, adopted by Augustus in AD 4, whose reign ended in seclusion on Capri amid treason trials.
  bio: >-
    Tiberius campaigned in Germany and Illyricum, was forced to divorce Vipsania to marry Julia, and retired to Rhodes in
    6 BC. Recalled and adopted after the deaths of Gaius and Lucius, he succeeded in 14 with visible reluctance, claiming to
    share government with the Senate. Germanicus' death in 19 and the influence of the praetorian prefect Sejanus darkened
    the reign; Tiberius withdrew to Capri in 26, and after Sejanus' fall in 31 treason trials multiplied. Administration of
    the provinces was careful and the treasury full at his death.
  evidence: Tacitus Annals 1–6, a masterpiece of hostile insinuation; Suetonius; Dio; Velleius Paterculus, who served under him and praises him. The contrast is a classic exercise in source criticism.
  relations:
    - {to: livia, type: parent}
    - {to: augustus, type: adoptive-parent}
    - {to: julia-elder, type: spouse}
    - {to: germanicus, type: adoptive-parent, note: 'Recorded on Germanicus'' entry: Tiberius adopted him in AD 4.'}
    - {to: sejanus, type: ally}
    - {to: caligula, type: successor}
- id: germanicus
  name: Germanicus
  full: Germanicus Julius Caesar
  born: {from: -15}
  died: {from: 19}
  category: general
  roles: [general, heir of Tiberius]
  dynasty: Julio-Claudian
  summary: Tiberius' nephew and adopted son, popular commander on the Rhine, whose death at Antioch in AD 19 was blamed on the governor Piso and, by insinuation, on Tiberius.
  bio: >-
    Son of Drusus the Elder and Antonia the Younger, Germanicus led campaigns into Germany (14–16), recovering legionary
    eagles lost under Varus. Sent to the East, he quarrelled with Cn. Calpurnius Piso and died suddenly. His widow
    Agrippina brought his ashes to Rome; Piso was tried and killed himself.
  evidence: >-
    Tacitus idealises him. The Senatus Consultum de Cn. Pisone Patre, a decree of AD 20 found in Spain in the 1980s, gives
    the Senate's official account of Piso's trial and allows a rare check on Tacitus.
  relations:
    - {to: tiberius, type: adoptive-parent}
    - {to: agrippina-elder, type: spouse}
    - {to: claudius, type: sibling}
    - {to: caligula, type: parent, note: 'Recorded on Caligula''s entry.'}
- id: agrippina-elder
  name: Agrippina the Elder
  born: {from: -14}
  died: {from: 33}
  category: woman
  roles: [granddaughter of Augustus]
  dynasty: Julio-Claudian
  summary: Daughter of Agrippa and Julia, wife of Germanicus and mother of Caligula and Agrippina the Younger, exiled by Tiberius after a bitter feud.
  bio: >-
    Agrippina accompanied Germanicus on campaign and saw herself as the true heir of Augustus' blood. After his death she
    opposed Tiberius and Sejanus; she and two of her sons were arrested, and she died on the island of Pandateria.
  evidence: Tacitus Annals; Suetonius.
  relations:
    - {to: agrippa, type: parent}
    - {to: julia-elder, type: parent}
    - {to: germanicus, type: spouse}
- id: sejanus
  name: Sejanus
  full: Lucius Aelius Sejanus
  born: {from: -20, circa: true}
  died: {from: 31}
  category: politician
  roles: [praetorian prefect]
  summary: Tiberius' praetorian prefect, who concentrated the Guard in one camp and controlled access to the emperor until his sudden fall and execution in AD 31.
  bio: >-
    An equestrian, Sejanus became Tiberius' indispensable minister, eliminated members of the imperial family and aimed,
    perhaps, at the succession. Tiberius, warned by Antonia, had him denounced in a letter to the Senate; he was executed and
    his supporters hunted down.
  evidence: Tacitus (the relevant books are partly lost), Dio Book 58, Juvenal's satire on his fall.
  relations:
    - {to: tiberius, type: ally}
- id: caligula
  name: Caligula
  full: Gaius Julius Caesar Germanicus
  born: {from: 12}
  died: {from: 41}
  category: ruler
  roles: [emperor AD 37–41]
  dynasty: Julio-Claudian
  summary: Son of Germanicus, acclaimed with enthusiasm in 37, murdered by praetorian officers in 41; the ancient image of a mad tyrant is now read more critically.
  bio: >-
    "Little Boots" grew up in his father's camps. His reign began with popular measures and ended in conflict with the
    Senate, conspiracies and executions. He demanded exceptional honours and humiliated senators. Officers of the Guard
    killed him in January 41, and the Guard then chose his uncle Claudius.
  evidence: >-
    Tacitus' account is lost; Suetonius, Dio, Seneca and Philo (who led a Jewish embassy to him) are hostile. Stories of his
    madness are often stock tyrant motifs or jokes taken literally; Winterling and others reinterpret his behaviour as
    deliberate humiliation of the aristocracy.
  relations:
    - {to: germanicus, type: parent}
    - {to: agrippina-elder, type: parent}
    - {to: claudius, type: successor}
- id: claudius
  name: Claudius
  full: Tiberius Claudius Nero Germanicus, later Tiberius Claudius Caesar Augustus Germanicus
  born: {from: -10}
  died: {from: 54}
  category: ruler
  roles: [emperor AD 41–54]
  dynasty: Julio-Claudian
  summary: The overlooked uncle made emperor by the Guard in 41, who conquered Britain, used freedmen as ministers and admitted Gauls to the Senate.
  bio: >-
    Kept from public life because of physical disabilities, Claudius became a scholar of Etruscan and Carthaginian history.
    Proclaimed by the praetorians, he courted them and the army, invaded Britain (43), extended citizenship and built the
    harbour at Ostia. His freedmen secretaries Narcissus and Pallas became powerful. His wife Messalina was executed in 48;
    he then married his niece Agrippina, adopted her son Nero over his own son Britannicus, and died in 54, reputedly
    poisoned.
  evidence: Tacitus Annals 11–12; Suetonius; Seneca's satire Apocolocyntosis; and the bronze tablet from Lyon preserving his speech on admitting Gallic senators, which can be compared with Tacitus' version.
  relations:
    - {to: germanicus, type: sibling}
    - {to: messalina, type: spouse}
    - {to: agrippina-younger, type: spouse}
    - {to: nero, type: adoptive-parent, note: 'Recorded on Nero''s entry.'}
  sources: [claudius-gauls]
- id: messalina
  name: Messalina
  full: Valeria Messalina
  born: {from: 17, circa: true}
  died: {from: 48}
  category: woman
  roles: [wife of Claudius]
  dynasty: Julio-Claudian
  summary: Claudius' third wife and mother of Britannicus, executed in 48 after a bigamous "marriage" to the consul-designate Silius.
  bio: >-
    The sources make Messalina a byword for lust and cruelty. Her ceremony with Gaius Silius in 48 may have been part of a
    plot against Claudius; his freedman Narcissus had her killed.
  evidence: Tacitus Annals 11, Juvenal and Pliny the Elder; the sexual details are stereotyped invective against a woman near power.
  relations:
    - {to: claudius, type: spouse}
- id: agrippina-younger
  name: Agrippina the Younger
  full: Julia Agrippina
  born: {from: 15}
  died: {from: 59}
  category: woman
  roles: [Augusta, mother of Nero]
  dynasty: Julio-Claudian
  summary: Daughter of Germanicus, wife of Claudius and mother of Nero, who wielded open power in the 50s until Nero had her killed in 59.
  bio: >-
    Agrippina married her uncle Claudius in 49, secured the adoption of her son Nero, and received the title Augusta. Coins
    of the early 50s show her with Claudius and then facing Nero. As Nero asserted himself her influence waned, and in 59 he
    had her murdered after a staged shipwreck failed.
  evidence: Tacitus Annals 12–14; coins; she wrote memoirs, now lost, which Tacitus used.
  relations:
    - {to: germanicus, type: parent}
    - {to: agrippina-elder, type: parent}
