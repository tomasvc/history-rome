# Curated cards on interpretations, sources and concepts; terms, people and dates are generated from the content.
- {id: fc-cornell, deck: Historians, lesson: origins, front: 'Tim Cornell, The Beginnings of Rome (1995): main argument?', back: 'The literary tradition about early Rome preserves a broadly reliable "structural core" (institutions, offices, some events) that archaeology supports, though the narratives are embellished.'}
- {id: fc-millar, deck: Historians, lesson: republican-constitution, front: 'Fergus Millar (1984) on the Roman Republic?', back: 'The Republic had a genuine democratic element: the people elected, legislated and were courted in public speeches.'}
- {id: fc-north, deck: Historians, lesson: republican-constitution, front: 'John North (1990) on popular power in the Republic?', back: 'The people decided only when the elite was divided; normally the system was oligarchic.'}
- {id: fc-harris, deck: Historians, lesson: punic-wars, front: 'W. V. Harris, War and Imperialism (1979)?', back: 'Roman expansion was driven by aggressive social structures: aristocratic glory, popular booty and annual war.'}
- {id: fc-eckstein, deck: Historians, lesson: punic-wars, front: 'Arthur Eckstein, Mediterranean Anarchy (2006)?', back: 'All Mediterranean states were militarised in an anarchic system; Rome was distinctive in mobilising and integrating allies.'}
- {id: fc-hopkins-cs, deck: Historians, lesson: price-of-empire, front: 'Keith Hopkins, Conquerors and Slaves (1978): the model?', back: 'Conquest brought wealth and slaves to Italy; elites bought land worked by slaves while peasant soldiers were displaced, creating a recruitment crisis.'}
- {id: fc-gruen74, deck: Historians, lesson: caesar, front: 'Erich Gruen, The Last Generation of the Roman Republic (1974)?', back: 'Institutions still worked in the 60s and 50s BC; the Republic fell because of the civil war of 49, not long decay.'}
- {id: fc-meier, deck: Historians, lesson: caesar, front: 'Christian Meier''s "crisis without alternative"?', back: 'Everyone could see that the Republic was in crisis, but no group could imagine or wanted a different system, so the crisis could not be resolved.'}
- {id: fc-flower, deck: Historians, lesson: gracchi, front: 'Harriet Flower, Roman Republics (2010)?', back: 'There was a sequence of distinct republics; the "republic of the nobles" ended in 133 or 88 BC, long before Caesar.'}
- {id: fc-cadiou, deck: Historians, lesson: marius-sulla, front: 'François Cadiou (2018) on the "Marian reforms"?', back: 'There was no sudden professionalisation of the army under Marius; conscription continued and change was gradual.'}
- {id: fc-syme, deck: Historians, lesson: augustus-power, front: 'Ronald Syme, The Roman Revolution (1939)?', back: 'Augustus'' rise was a revolution in which a new faction seized power by violence and propaganda behind Republican forms.'}
- {id: fc-zanker, deck: Historians, lesson: augustan-rome, front: 'Paul Zanker, The Power of Images (1987/88)?', back: 'The Augustan age created a new, coherent visual language drawn from classical Greek art, spread by many agents, not just the regime.'}
- {id: fc-millar77, deck: Historians, lesson: governing-provinces, front: 'Fergus Millar, The Emperor in the Roman World (1977)?', back: 'The emperor''s role was essentially reactive: answering embassies, petitions and letters.'}
- {id: fc-luttwak, deck: Historians, lesson: army-frontiers, front: 'Edward Luttwak (1976): Roman grand strategy in three systems?', back: 'Client states and mobile legions; preclusive linear defence; defence in depth with field armies.'}
- {id: fc-isaac, deck: Historians, lesson: army-frontiers, front: 'Benjamin Isaac, The Limits of Empire (1990)?', back: 'Rome lacked the means for grand strategy; eastern armies largely policed provinces and supported expansion.'}
- {id: fc-finley, deck: Historians, lesson: roman-economy, front: 'Moses Finley, The Ancient Economy (1973)?', back: 'Economic behaviour was embedded in status; no integrated markets or economic policy; cities consumed rather than produced.'}
- {id: fc-hopkins-tt, deck: Historians, lesson: roman-economy, front: 'Keith Hopkins, "Taxes and Trade" (1980)?', back: 'Taxes paid in money forced provinces to sell goods to where the state spent: Rome and the frontier armies. This integrated the economy.'}
- {id: fc-witschel, deck: Historians, lesson: third-century-crisis, front: 'Christian Witschel (1999) on the third century?', back: 'No general crisis: great regional variation, with some provinces prospering while others suffered.'}
- {id: fc-stark, deck: Historians, lesson: christianisation, front: 'Rodney Stark''s model of Christian growth?', back: 'About 40 per cent per decade from c. 1,000 in AD 40, reaching about 10 per cent by 300 and a majority by 350. A model, not data.'}
- {id: fc-barnes, deck: Historians, lesson: constantine, front: 'T. D. Barnes on Constantine?', back: 'Constantine was a sincere Christian from 312, and his policies followed from that conviction.'}
- {id: fc-heather, deck: Historians, lesson: fall-of-the-west, front: 'Peter Heather (2005) on the fall of the West?', back: 'External pressure: the Huns pushed groups into the empire; the loss of revenue-producing provinces made recovery impossible.'}
- {id: fc-wardperkins, deck: Historians, lesson: fall-of-the-west, front: 'Bryan Ward-Perkins (2005)?', back: 'The end of Roman rule caused a dramatic collapse of economic complexity and living standards, visible in archaeology.'}
- {id: fc-goffart, deck: Historians, lesson: fall-of-the-west, front: 'Walter Goffart (1980) on barbarian settlement?', back: 'Barbarians were accommodated through shares of tax revenue rather than mass expropriation of land.'}
- {id: fc-brown, deck: Historians, lesson: christianisation, front: 'Peter Brown, The World of Late Antiquity (1971)?', back: 'Late antiquity was a creative period of religious and cultural transformation, not simply decline.'}
- {id: fc-kaldellis, deck: Historians, lesson: roman-or-byzantine, front: 'Anthony Kaldellis on Byzantine identity?', back: 'The medieval empire was a Roman polity; "Roman" was its people''s ethnic identity; "Byzantine" is a later, prejudicial label.'}
- {id: fc-harper, deck: Historians, lesson: environment-disease, front: 'Kyle Harper, The Fate of Rome (2017)?', back: 'Climate change and pandemics were central causes of the empire''s crises.'}
- {id: fc-woolf, deck: Historians, lesson: romanisation, front: 'Greg Woolf, Becoming Roman (1998)?', back: 'Provincials in Gaul became Roman by participating in a new imperial culture that was itself created in the provinces.'}
- {id: fc-isaac04, deck: Historians, lesson: race-ethnicity, front: 'Benjamin Isaac''s "proto-racism"?', back: 'Ancient ideas attributing fixed, sometimes inherited, collective traits to peoples, explained by climate, which anticipated modern racism.'}
- {id: fc-src-livy, deck: Sources, lesson: historiography, front: 'Why must Livy''s account of the kings be used with caution?', back: 'Written five centuries later from late sources; Livy admits early records were lost and that the stories are poetic tales.'}
- {id: fc-src-tacitus, deck: Sources, lesson: historiography, front: 'Tacitus'' claim "without anger or partisanship"?', back: 'A convention; his senatorial perspective and literary techniques (insinuation, irony) shape his judgement.'}
- {id: fc-src-ha, deck: Sources, lesson: trajan-hadrian, front: 'What is the problem with the Historia Augusta?', back: 'Written by one author c. 400 pretending to be six authors c. 300; the later lives contain invented documents and people.'}
- {id: fc-src-procopius, deck: Sources, lesson: justinian, front: 'Procopius'' three works and their tones?', back: 'Wars (classicising history), Buildings (panegyric), Secret History (invective).'}
- {id: fc-src-rg, deck: Sources, lesson: augustus-power, front: 'Where does the text of the Res Gestae come from?', back: 'Copies inscribed in Galatia, especially the Latin and Greek text on the temple of Rome and Augustus at Ancyra (Ankara); the bronze original is lost.'}
- {id: fc-src-vindolanda, deck: Sources, lesson: army-frontiers, front: 'What are the Vindolanda tablets?', back: 'Wooden writing tablets of c. 85–130 from a fort in northern Britain: military reports, accounts and private letters.'}
- {id: fc-src-papyri, deck: Sources, lesson: governing-provinces, front: 'Why must Egyptian papyri be generalised with care?', back: 'Egypt had distinctive administrative traditions and is the only province where papyri survive in large numbers.'}
- {id: fc-con-prorogation, deck: Concepts, lesson: republican-constitution, front: 'Prorogation and its long-term danger?', back: 'Extension of a magistrate''s imperium after his year; it let a few officials run an empire but gave individuals long, distant commands.'}
- {id: fc-con-sc, deck: Concepts, lesson: gracchi, front: 'Senatus consultum ultimum: what and when first?', back: 'The Senate''s "ultimate decree" urging magistrates to protect the state; first used against Gaius Gracchus in 121 BC. Its legality was always disputed.'}
- {id: fc-con-acceptance, deck: Concepts, lesson: power-legitimacy, front: 'The principate as an "acceptance system"?', back: 'Egon Flaig: an emperor depended on continuing acceptance by army, Senate and people; usurpation removed rulers who lost it.'}
- {id: fc-con-epigraphic, deck: Concepts, lesson: third-century-crisis, front: 'The "epigraphic habit"?', back: 'Ramsay MacMullen''s term for the rise and fall of inscription-making, peaking c. 200; a decline may reflect changing habits, not only crisis.'}
- {id: fc-con-certainty, deck: Concepts, lesson: historiography, front: 'Established, interpretation, contested, speculative: what do the labels mean?', back: 'Strong evidence and consensus; a reasonable reading others might dispute; serious scholarly disagreement; a hypothesis with weak evidence.'}
