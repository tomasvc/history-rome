- {id: consul, term: consul, lang: Latin, category: office, def: 'The two chief annual magistrates of the Republic, holding imperium to command armies and preside over the Senate and assemblies. Each could block the other. Under the emperors the office survived as an honour, and years were still named after consuls until the sixth century.', related: [imperium, cursus-honorum, praetor]}
- {id: praetor, term: praetor, lang: Latin, category: office, def: 'Magistrate with imperium below the consuls, chiefly responsible for justice in Rome; the urban praetor''s edict shaped Roman private law. Numbers grew from one (367 BC) to eight under Sulla, as praetors were also needed to govern provinces.', related: [consul, edict, promagistrate]}
- {id: quaestor, term: quaestor, lang: Latin, category: office, def: 'The junior magistracy concerned with finance, often attached to a consul or governor. After Sulla, election as quaestor brought membership of the Senate.', related: [cursus-honorum, senate]}
- {id: aedile, term: aedile, lang: Latin, category: office, def: 'Magistrate responsible for markets, streets, the grain supply and public games in Rome. Games were a chance to buy popularity before elections to higher office.', related: [cursus-honorum]}
- {id: censor, term: censor, lang: Latin, category: office, def: 'Two senior ex-consuls elected about every five years to conduct the census, assign citizens to classes and tribes, revise the roll of the Senate and let public contracts.', related: [census, senate]}
- {id: tribune-plebs, term: tribune of the plebs, lang: Latin, literal: tribunus plebis, category: office, def: 'Ten annual officers elected by the plebeians, originally to protect plebeians against magistrates. Their persons were sacrosanct; they could veto (intercessio) any act of a magistrate and propose laws to the plebeian assembly. In the late Republic the office became a powerful instrument for reformers and demagogues.', related: [intercessio, concilium-plebis, tribunicia-potestas, plebiscitum]}
- {id: dictator, term: dictator, lang: Latin, category: office, def: 'An emergency magistrate appointed for a maximum of six months with overriding imperium. Revived in an unprecedented form by Sulla (82 BC) and Caesar, who became dictator for life in 44 BC.', related: [imperium, magister-equitum]}
- {id: magister-equitum, term: master of horse, lang: Latin, literal: magister equitum, category: office, def: 'The dictator''s deputy, appointed by him.', related: [dictator]}
- {id: promagistrate, term: promagistrate, lang: Latin, literal: 'pro consule, pro praetore', category: office, def: 'A former consul or praetor whose imperium was extended to govern a province or command an army ("proconsul", "propraetor"). Prorogation allowed Rome to run an empire with a small number of annual magistrates.', related: [imperium, consul, praetor]}
- {id: legatus, term: legate, lang: Latin, literal: legatus, category: office, def: 'A deputy appointed by a commander or emperor. Under the Principate most armed provinces were governed by the emperor''s legates (legati Augusti pro praetore), and each legion was commanded by a senatorial legate.', related: [princeps, legion]}
- {id: princeps, term: princeps, lang: Latin, literal: 'first man, leading citizen', category: concept, def: 'The informal title Augustus preferred, implying first among citizens rather than king. Hence "Principate" for the system of rule from 27 BC to the third century.', related: [principate, auctoritas, imperator]}
- {id: imperator, term: imperator, lang: Latin, literal: commander, category: office, def: 'Originally a title acclaimed by soldiers for a victorious general. Augustus used it as a first name (praenomen) and it became a standard part of imperial titulature, the root of the word "emperor".', related: [princeps, imperium]}
- {id: augustus-title, term: Augustus (title), lang: Latin, literal: 'revered, augmented', category: office, def: 'Name voted to Octavian in 27 BC, with religious overtones. It became the title of the senior ruler; under the Tetrarchy there were two Augusti, each with a junior Caesar.', related: [caesar-title, tetrarchy]}
- {id: caesar-title, term: Caesar (title), lang: Latin, category: office, def: 'Originally the family name of the Julii Caesares, adopted by Augustus and his heirs. From the second century it designated the heir or junior emperor; it survives in "Kaiser" and "tsar".', related: [augustus-title]}
- {id: imperium, term: imperium, lang: Latin, literal: 'command, power', category: concept, def: 'The power to command armies and to coerce, held by consuls, praetors, dictators and promagistrates and symbolised by the fasces. By extension, the area over which Rome exercised power, hence "empire".', related: [consul, promagistrate, imperium-maius]}
- {id: imperium-maius, term: imperium maius, lang: Latin, literal: greater command, category: concept, def: 'Command superior to that of other governors in their own provinces. Granted to Augustus in 23 BC and to some favoured members of his family; a key legal basis of imperial power.', related: [imperium, tribunicia-potestas]}
- {id: tribunicia-potestas, term: tribunician power, lang: Latin, literal: tribunicia potestas, category: concept, def: 'The powers of a tribune of the plebs (veto, proposing laws, sacrosanctity) held by Augustus from 23 BC without the office itself. Emperors numbered their regnal years by it, which makes it vital for dating coins and inscriptions.', related: [tribune-plebs, imperium-maius]}
- {id: auctoritas, term: auctoritas, lang: Latin, literal: 'authority, influence', category: concept, def: 'Prestige that commands deference without legal compulsion. The Senate''s advice carried auctoritas; Augustus claimed to surpass all others in auctoritas while having no more power than his colleagues (Res Gestae 34).', related: [senate, princeps, dignitas]}
- {id: dignitas, term: dignitas, lang: Latin, literal: 'worth, standing', category: concept, def: 'A Roman aristocrat''s public standing, built from offices, achievements and ancestry. Caesar claimed to have crossed the Rubicon in defence of his dignitas.', related: [auctoritas, virtus]}
- {id: virtus, term: virtus, lang: Latin, literal: 'manliness, excellence', category: concept, def: 'Courage and excellence, especially in war; the core value of the Roman aristocracy.', related: [dignitas, mos-maiorum]}
- {id: pietas, term: pietas, lang: Latin, literal: dutifulness, category: concept, def: 'Proper dutiful conduct toward gods, family and country, embodied by Aeneas in Virgil''s Aeneid and claimed by emperors on their coins.', related: [mos-maiorum]}
- {id: clementia, term: clementia, lang: Latin, literal: mercy, category: concept, def: 'Mercy toward defeated enemies. Caesar''s clemency to his opponents was admired and resented, since mercy is a superior''s gift.', related: [dignitas]}
- {id: libertas, term: libertas, lang: Latin, literal: freedom, category: concept, def: 'Freedom, meaning both the status of a free person and the political freedom of citizens under the Republic. Different groups meant different things by it: freedom of the people from magistrates, or freedom of the aristocracy from domination by one man.', related: [res-publica]}
- {id: res-publica, term: res publica, lang: Latin, literal: 'the public thing, commonwealth', category: concept, def: 'The Roman state or commonwealth. It did not mean "republic" in the modern anti-monarchical sense; Augustus could claim to have restored the res publica while ruling it.', related: [libertas, spqr]}
- {id: spqr, term: SPQR, lang: Latin, literal: Senatus Populusque Romanus, category: concept, def: '"The Senate and People of Rome", the formal name of the Roman state, found on inscriptions, standards and coins from the Republic onwards.', related: [senate, res-publica]}
- {id: mos-maiorum, term: mos maiorum, lang: Latin, literal: custom of the ancestors, category: concept, def: 'The unwritten conventions and precedents that governed Roman public life. Much of the Republican "constitution" was custom rather than law, which made it vulnerable when politicians ignored precedent.', related: [res-publica, virtus]}
- {id: senate, term: Senate, lang: Latin, literal: senatus, category: institution, def: 'The council of former magistrates (about 300 members in the middle Republic, 600 after Sulla). It had no formal legislative power but advised magistrates through decrees (senatus consulta), controlled finance and foreign policy, and embodied aristocratic auctoritas. Under the emperors it became a court, an assembly of the elite and a source of governors.', related: [senatus-consultum, auctoritas, curia]}
- {id: curia, term: curia, lang: Latin, category: institution, def: 'The Senate house in the Forum; also one of the thirty early divisions of the Roman people, and, in later usage, a town council and the curiales who served on it.', related: [senate, decurion]}
- {id: senatus-consultum, term: senatus consultum, lang: Latin, literal: decree of the Senate, category: institution, def: 'The Senate''s formal advice to a magistrate. In theory advisory, in practice usually obeyed.', related: [senate, sc-ultimum]}
- {id: sc-ultimum, term: senatus consultum ultimum, lang: Latin, literal: final decree, category: institution, def: 'The modern name for the Senate''s emergency decree urging magistrates to "see that the state suffer no harm", first used against Gaius Gracchus in 121 BC. Its legality for killing citizens without trial was fiercely disputed.', related: [senatus-consultum, provocatio]}
- {id: comitia-centuriata, term: centuriate assembly, lang: Latin, literal: comitia centuriata, category: institution, def: 'The assembly of the people organised in 193 "centuries" by wealth and age. It elected consuls, praetors and censors and declared war. Voting by century gave the wealthy a built-in majority.', related: [census, comitia-tributa]}
- {id: comitia-tributa, term: tribal assembly, lang: Latin, literal: comitia tributa, category: institution, def: 'The assembly of all citizens organised by the 35 territorial tribes, presided over by a magistrate; it elected junior magistrates and passed laws.', related: [tribus, concilium-plebis]}
- {id: concilium-plebis, term: plebeian assembly, lang: Latin, literal: concilium plebis, category: institution, def: 'The assembly of plebeians, organised by tribes and presided over by tribunes. It elected tribunes and aediles of the plebs, and after 287 BC its resolutions (plebiscita) bound all citizens.', related: [plebiscitum, tribune-plebs]}
- {id: plebiscitum, term: plebiscite, lang: Latin, literal: plebiscitum, category: law, def: 'A resolution of the plebeian assembly. The lex Hortensia (287 BC) made plebiscites binding on the whole people; most late Republican legislation took this form.', related: [concilium-plebis]}
- {id: tribus, term: tribe, lang: Latin, literal: tribus, category: institution, def: 'One of the 35 territorial voting divisions of the citizen body (fixed at 35 from 241 BC). New citizens were enrolled in tribes, and their distribution was a political battleground after the Social War.', related: [comitia-tributa]}
- {id: census, term: census, category: institution, def: 'The periodic registration of citizens and their property by the censors, which determined military obligations, tax liability and voting class. Surviving census figures are a crucial if problematic source for Roman population.', related: [censor, comitia-centuriata]}
- {id: cursus-honorum, term: cursus honorum, lang: Latin, literal: course of offices, category: institution, def: 'The sequence of magistracies a senatorial career followed: quaestor, (aedile or tribune), praetor, consul. The lex Villia annalis of 180 BC set minimum ages and intervals.', related: [quaestor, praetor, consul, aedile]}
- {id: intercessio, term: veto, lang: Latin, literal: intercessio, category: concept, def: 'The right of a magistrate, above all a tribune, to block the action of a colleague or junior. Tiberius Gracchus'' removal of the vetoing tribune Octavius in 133 BC broke a fundamental convention.', related: [tribune-plebs]}
- {id: provocatio, term: provocatio, lang: Latin, literal: appeal, category: law, def: 'The citizen''s right to appeal to the people against a magistrate''s sentence of death or flogging. Its violation by the senatus consultum ultimum was a central grievance of popular politicians.', related: [sc-ultimum]}
- {id: lex, term: lex, lang: Latin, literal: 'law, statute', category: law, def: 'A law passed by an assembly of the people on a magistrate''s proposal, usually named after its proposer (e.g. lex Sempronia). Under the emperors legislation shifted to imperial pronouncements.', related: [plebiscitum, edict]}
- {id: edict, term: edict, lang: Latin, literal: edictum, category: law, def: 'A public proclamation by a magistrate or emperor. The praetors'' annual edicts developed Roman private law; imperial edicts announced policy across the empire.', related: [praetor, rescript]}
- {id: rescript, term: rescript, lang: Latin, literal: rescriptum, category: law, def: 'A written imperial reply to a petition or query, which became a source of law. Much of the Codex Justinianus consists of rescripts.', related: [edict]}
- {id: quaestio, term: quaestio, lang: Latin, literal: 'inquiry, standing court', category: law, def: 'A permanent jury court for a specific crime (extortion, treason, murder), established from 149 BC. Control of the juries, by senators or equites, was a political issue from Gaius Gracchus to Sulla.', related: [equites, repetundae]}
- {id: repetundae, term: res repetundae, lang: Latin, literal: things to be recovered, category: law, def: 'Extortion by provincial governors. The first standing court (149 BC) was set up to try it, a sign of the problems provincial rule created.', related: [quaestio]}
- {id: patricians, term: patricians, lang: Latin, literal: patricii, category: society, def: 'The hereditary aristocracy of early Rome, which initially monopolised priesthoods and magistracies. By the late Republic only a few patrician families remained, and the distinction mattered mainly for certain offices and priesthoods.', related: [plebeians, conflict-orders]}
- {id: plebeians, term: plebeians, lang: Latin, literal: plebs, category: society, def: 'All citizens who were not patricians, from poor farmers to rich families. Wealthy plebeians gained access to the magistracies in the fourth century and merged with patricians into the nobilitas.', related: [patricians, nobilitas, tribune-plebs]}
- {id: conflict-orders, term: Conflict of the Orders, category: historiography, def: 'The modern name for the struggle between patricians and plebeians from 494 to 287 BC (traditional dates) over debt, land, law and access to office. The sources are late and stylised, but the outcome, a new patricio-plebeian elite, is secure.', related: [patricians, plebeians]}
- {id: nobilitas, term: nobility, lang: Latin, literal: nobilitas, category: society, def: 'The informal elite of families with consular ancestors, patrician or plebeian. Nobles dominated the consulship; outsiders like Cato or Cicero were "new men".', related: [novus-homo, plebeians]}
- {id: novus-homo, term: new man, lang: Latin, literal: novus homo, category: society, def: 'The first man of his family to reach the Senate or the consulship, such as Marius or Cicero.', related: [nobilitas]}
- {id: equites, term: equites, lang: Latin, literal: 'horsemen, knights', category: society, def: 'The order of wealthy non-senators, originally the cavalry. In the late Republic they included tax contractors and businessmen; under the emperors they staffed procuratorships and the great prefectures.', related: [publicani, procurator]}
- {id: optimates, term: optimates, lang: Latin, literal: the best men, category: concept, def: 'Politicians who claimed to defend the authority of the Senate. Not a party: a label of political style and self-description, opposed to populares.', related: [populares]}
- {id: populares, term: populares, lang: Latin, literal: men of the people, category: concept, def: 'Politicians who worked through the people and the tribunate, often with land, grain or debt measures, rather than through the Senate. Many were aristocrats; it was a method, not a class or party.', related: [optimates, tribune-plebs]}
- {id: clientela, term: patronage, lang: Latin, literal: clientela, category: society, def: 'The relationship of reciprocal obligation between a patron and his clients: protection and favours in exchange for support and deference. It structured Roman society from the morning greeting (salutatio) to foreign relations.', related: [paterfamilias, freedman]}
- {id: paterfamilias, term: paterfamilias, lang: Latin, literal: father of the family, category: society, def: 'The oldest living male ascendant, who held legal power (patria potestas) over his descendants and their property. Demographic modelling suggests many Romans were freed from it by their father''s death well before middle age.', related: [patria-potestas, manus]}
- {id: patria-potestas, term: patria potestas, lang: Latin, literal: paternal power, category: law, def: 'The legal power of the paterfamilias over children and grandchildren in his power, including in theory life and death and ownership of all property.', related: [paterfamilias]}
- {id: manus, term: manus, lang: Latin, literal: hand, category: law, def: 'A form of marriage in which the wife passed into the legal control of her husband''s family. By the late Republic most marriages were without manus, so wives stayed in their fathers'' power and kept their own property.', related: [paterfamilias, dos]}
- {id: dos, term: dowry, lang: Latin, literal: dos, category: law, def: 'Property given with a bride to her husband, which in principle had to be returned if the marriage ended by divorce or his death.', related: [manus]}
- {id: freedman, term: 'freedman, freedwoman', lang: Latin, literal: 'libertus, liberta', category: society, def: 'A former slave. Freed slaves of Roman citizens, if formally manumitted, became citizens, though with obligations to their former owners as patrons and some disabilities. Freedpeople are prominent in inscriptions.', related: [manumission, clientela]}
- {id: manumission, term: manumission, lang: Latin, literal: manumissio, category: society, def: 'The freeing of a slave by an owner. Romans freed slaves on a scale unusual among slave societies, which made freedpeople a large and visible group.', related: [freedman, peculium]}
- {id: peculium, term: peculium, lang: Latin, category: law, def: 'Property that a slave or son-in-power was allowed to manage, though it legally belonged to the master or father. Slaves could use it to run businesses and sometimes buy their freedom.', related: [manumission]}
- {id: nexum, term: nexum, lang: Latin, category: law, def: 'Debt bondage in early Rome, by which a debtor pledged his own labour. Abolished, according to tradition, by the lex Poetelia of 326 BC.', related: [conflict-orders]}
- {id: ager-publicus, term: ager publicus, lang: Latin, literal: public land, category: economy, def: 'Land confiscated from defeated enemies and owned by the Roman state, much of it occupied by wealthy landholders. The Gracchan land law sought to enforce limits on its occupation and redistribute the rest.', related: [latifundia]}
- {id: latifundia, term: latifundia, lang: Latin, literal: broad estates, category: economy, def: 'Large estates, often worked by slaves. Their spread in Italy after the conquests is attested but its scale and timing are debated.', related: [ager-publicus, slavery-system]}
- {id: slavery-system, term: slave society, category: historiography, def: 'A society in which slaves form a large share of the population and play a central role in production, as opposed to a society with slaves (Finley). Roman Italy in the late Republic is one of the few clear examples.', related: [manumission]}
- {id: socii, term: allies, lang: Latin, literal: socii, category: institution, def: 'The Italian communities bound to Rome by treaty, obliged to supply troops but not taxed. Their exclusion from citizenship and its benefits led to the Social War (91–87 BC).', related: [latin-rights, foedus]}
- {id: latin-rights, term: Latin rights, lang: Latin, literal: ius Latii, category: law, def: 'An intermediate status between Roman citizenship and foreignness, including rights of marriage and commerce with Romans; under the emperors, magistrates of Latin towns gained Roman citizenship.', related: [socii, municipium]}
- {id: colonia, term: colony, lang: Latin, literal: colonia, category: institution, def: 'A settlement of Roman or Latin citizens on conquered land, serving as garrison and as a means of rewarding citizens and veterans.', related: [municipium]}
- {id: municipium, term: municipium, lang: Latin, category: institution, def: 'A self-governing community whose citizens held Roman (or Latin) citizenship; the basic unit of local government in Italy and many provinces.', related: [colonia, decurion]}
- {id: decurion, term: decurion, lang: Latin, literal: decurio, category: office, def: 'A member of a town council. Decurions were responsible for local government and, increasingly, for collecting taxes, which became a burden in late antiquity.', related: [curia, municipium]}
- {id: foedus, term: treaty, lang: Latin, literal: foedus, category: institution, def: 'A formal treaty. Late Roman agreements with barbarian groups settled within the empire are often described as foedera, and the groups as foederati, though the terms covered varied arrangements.', related: [foederati, socii]}
- {id: foederati, term: federates, lang: Latin, literal: foederati, category: military, def: 'Barbarian groups serving Rome under treaty, often under their own leaders. The Gothic settlement of 382 is the classic but debated example.', related: [foedus]}
- {id: publicani, term: publicani, lang: Latin, category: economy, def: 'Private contractors, organised in companies, who bid for state contracts including the collection of taxes in some provinces. Notorious for exploitation in the late Republic; their role shrank under the emperors.', related: [equites, tributum]}
- {id: tributum, term: tributum, lang: Latin, category: economy, def: 'Direct tax. Roman citizens in Italy paid none after 167 BC; provincials paid tributum on land (soli) and persons (capitis), assessed by census.', related: [census, iugatio]}
- {id: iugatio, term: iugatio and capitatio, lang: Latin, category: economy, def: 'The late Roman system, developed under Diocletian, that assessed tax on units of land (iuga) and of persons or labour (capita), allowing regular budgeting through indictions.', related: [tributum, annona]}
- {id: annona, term: annona, lang: Latin, literal: 'year''s harvest, grain supply', category: economy, def: 'The supply of grain to the city of Rome (later also Constantinople), including free distributions to citizens, and in late antiquity the levies in kind that fed the army.', related: [frumentatio]}
- {id: frumentatio, term: grain distribution, lang: Latin, literal: frumentatio, category: economy, def: 'Subsidised and later free grain for Roman citizens resident in the city, begun by Gaius Gracchus (123 BC) and made free by Clodius (58 BC).', related: [annona]}
- {id: fiscus, term: fiscus, lang: Latin, category: economy, def: 'The emperor''s treasury, distinct at first from the state treasury (aerarium Saturni); over time the distinction faded.', related: [aerarium-militare]}
- {id: aerarium-militare, term: military treasury, lang: Latin, literal: aerarium militare, category: economy, def: 'Fund created by Augustus in AD 6 to pay retirement bonuses to veterans, financed by new taxes on inheritances and sales. It ended the dependence of soldiers on their generals for land.', related: [fiscus, legion]}
- {id: denarius, term: denarius, lang: Latin, category: economy, def: 'The standard Roman silver coin, introduced around 211 BC and progressively debased under the emperors until replaced in the third century.', related: [antoninianus, aureus]}
- {id: sestertius, term: sestertius, lang: Latin, category: economy, def: 'The unit of account (a quarter of a denarius) in which Romans reckoned prices and fortunes; under the emperors also a large brass coin.', related: [denarius]}
- {id: aureus, term: aureus, lang: Latin, category: economy, def: 'The gold coin of the Principate, worth 25 denarii.', related: [denarius, solidus]}
- {id: antoninianus, term: antoninianus, lang: Latin, category: economy, def: 'A modern name for the silver coin introduced by Caracalla in 215, probably tariffed at two denarii but containing less silver. Debased to a silver-washed bronze by the 260s.', related: [denarius]}
- {id: solidus, term: solidus, lang: Latin, category: economy, def: 'The gold coin introduced by Constantine at 72 to the pound, which remained stable for some seven centuries and became the "dollar of the Middle Ages".', related: [aureus]}
- {id: legion, term: legion, lang: Latin, literal: legio, category: military, def: 'The main unit of Roman citizen heavy infantry, of roughly 4,000–6,000 men. Under the Principate about 25–30 legions, each with a number and title, were stationed mainly on the frontiers.', related: [cohort, century, auxilia]}
- {id: cohort, term: cohort, lang: Latin, literal: cohors, category: military, def: 'A tactical unit of about 480 men; ten made a legion. Auxiliary infantry units were also called cohorts.', related: [legion, century]}
- {id: century, term: century, lang: Latin, literal: centuria, category: military, def: 'A unit of about 80 men commanded by a centurion; also a voting unit in the centuriate assembly.', related: [cohort, centurion]}
- {id: centurion, term: centurion, lang: Latin, literal: centurio, category: military, def: 'The professional officer commanding a century, the backbone of the legion''s discipline and experience.', related: [century]}
- {id: contubernium, term: contubernium, lang: Latin, literal: tent group, category: military, def: 'The eight soldiers who shared a tent and a mule; also used of the quasi-marriages of slaves.', related: [century]}
- {id: auxilia, term: auxiliaries, lang: Latin, literal: auxilia, category: military, def: 'Non-citizen soldiers serving in cohorts and cavalry alae under the Principate, rewarded with citizenship on discharge after 25 years; they came to outnumber the legionaries.', related: [legion, diploma]}
- {id: diploma, term: military diploma, category: military, def: 'A bronze certificate recording the grant of citizenship and the right of legal marriage to a discharged auxiliary. Diplomas are precise, datable evidence for the army''s units and recruitment.', related: [auxilia]}
- {id: sacramentum, term: sacramentum, lang: Latin, literal: oath, category: military, def: 'The military oath sworn by soldiers to their commander, and under the Principate to the emperor; Christian writers later used the word for the sacraments.', related: [legion]}
- {id: praetorian-guard, term: Praetorian Guard, category: military, def: 'The emperor''s guard in Rome, concentrated in one camp by Sejanus under Tiberius. Its prefects were powerful and its soldiers made and unmade emperors, as in AD 41, 69 and 193. Disbanded by Constantine in 312.', related: [praetorian-prefect]}
- {id: praetorian-prefect, term: praetorian prefect, lang: Latin, literal: praefectus praetorio, category: office, def: 'Equestrian commander of the Praetorian Guard, later the emperor''s chief deputy in judicial and fiscal matters. From Constantine the prefects became regional civil governors-general.', related: [praetorian-guard, vicarius]}
- {id: procurator, term: procurator, lang: Latin, category: office, def: 'An imperial agent, usually equestrian or a freedman, managing the emperor''s property and finances in a province; some governed small provinces such as Judaea.', related: [equites]}
- {id: limes, term: limes, lang: Latin, literal: 'path, boundary road', category: military, def: 'The modern collective term for Roman frontier systems; in Latin the word could mean a patrolled road or, later, a frontier district. Modern scholars debate whether these were defensive lines or zones of control.', related: [legion, limitanei]}
- {id: comitatenses, term: comitatenses, lang: Latin, literal: of the retinue, category: military, def: 'The mobile field armies of the late empire, attached to emperors or regional commanders.', related: [limitanei, magister-militum]}
- {id: limitanei, term: limitanei, lang: Latin, literal: frontier troops, category: military, def: 'Late Roman frontier garrisons under duces, once dismissed as farmer-militia but now seen as regular soldiers.', related: [comitatenses, dux]}
- {id: magister-militum, term: magister militum, lang: Latin, literal: master of soldiers, category: office, def: 'The senior late Roman military commanders. In the fifth-century West, magistri like Stilicho, Aetius and Ricimer often held real power over the emperors.', related: [comitatenses]}
- {id: dux, term: dux, lang: Latin, literal: leader, category: office, def: 'Commander of frontier troops in a late Roman frontier district; the root of "duke".', related: [limitanei]}
- {id: vicarius, term: vicar, lang: Latin, literal: vicarius, category: office, def: 'Governor of a late Roman diocese (a group of provinces), standing in for the praetorian prefect.', related: [diocese, praetorian-prefect]}
- {id: diocese, term: diocese, lang: Latin, literal: dioecesis, category: institution, def: 'A late Roman administrative grouping of provinces under a vicar, created under Diocletian; the word passed to the church.', related: [vicarius, tetrarchy]}
- {id: tetrarchy, term: Tetrarchy, lang: Greek, literal: rule of four, category: institution, def: 'The modern name for the college of two senior Augusti and two junior Caesars established by Diocletian in 293. Each had a zone of responsibility, but legislation and ideology presented a single empire.', related: [augustus-title, caesar-title, dominate]}
- {id: principate, term: Principate, category: historiography, def: 'The system of rule by a princeps from Augustus to the third century, in which monarchy operated through Republican forms and the cooperation of the Senate.', related: [princeps, dominate]}
- {id: dominate, term: Dominate, category: historiography, def: 'An older modern label for the late empire from Diocletian, from dominus ("lord"), implying open autocracy. Many historians now avoid it as overdrawn.', related: [principate, tetrarchy]}
- {id: consistory, term: consistory, lang: Latin, literal: consistorium, category: institution, def: 'The late Roman imperial council, so called because members stood in the emperor''s presence.', related: [dominate]}
- {id: honestiores, term: honestiores and humiliores, lang: Latin, literal: 'the more honourable, the humbler', category: law, def: 'The legal distinction that emerged in the second century between privileged and ordinary free people, who faced different penalties (humiliores could be tortured, crucified or condemned to the beasts).', related: [constitutio-antoniniana]}
- {id: constitutio-antoniniana, term: Constitutio Antoniniana, lang: Latin, category: law, def: 'Caracalla''s edict of AD 212 granting Roman citizenship to almost all free inhabitants of the empire. Its motives (tax, religion, unity) and its exceptions (the dediticii) are debated.', related: [honestiores, ius-civile]}
- {id: ius-civile, term: ius civile, lang: Latin, literal: civil law, category: law, def: 'The law applying to Roman citizens, as opposed to ius gentium, the law of nations applied to dealings with and between foreigners.', related: [ius-gentium, jurist]}
- {id: ius-gentium, term: ius gentium, lang: Latin, literal: law of nations, category: law, def: 'Rules thought common to all peoples, developed by the peregrine praetor for cases involving foreigners and later theorised by jurists.', related: [ius-civile]}
- {id: jurist, term: jurist, lang: Latin, literal: iurisconsultus, category: law, def: 'Legal experts who gave opinions and wrote treatises. Excerpts from jurists such as Gaius, Papinian, Ulpian and Paul make up Justinian''s Digest.', related: [digest]}
- {id: twelve-tables, term: Twelve Tables, category: law, def: 'The earliest Roman law code, traditionally published in 451–450 BC by the decemvirs. It survives only in later quotations, which have been reconstructed into tables.', related: [conflict-orders, lex]}
- {id: corpus-iuris, term: Corpus Iuris Civilis, lang: Latin, literal: body of civil law, category: law, def: 'The modern name for Justinian''s legal compilation: the Codex (imperial laws), Digest (jurists), Institutes (textbook) and Novels (new laws). Its rediscovery in eleventh-century Italy shaped European law.', related: [digest, jurist]}
- {id: digest, term: Digest, lang: Latin, literal: Digesta or Pandectae, category: law, def: 'The fifty books of excerpts from classical jurists compiled by Tribonian''s commission and published in 533.', related: [corpus-iuris]}
- {id: pontifex-maximus, term: pontifex maximus, lang: Latin, literal: greatest bridge-builder, category: religion, def: 'Head of the college of pontiffs, which supervised public religion and the calendar. Caesar held it from 63 BC; Augustus from 12 BC; every emperor thereafter until Gratian gave up the title.', related: [vestals, augury]}
- {id: vestals, term: Vestal Virgins, category: religion, def: 'Six priestesses of Vesta who kept the sacred fire of the city. Their chastity was bound up with Rome''s safety, and unchaste Vestals were buried alive.', related: [pontifex-maximus]}
- {id: augury, term: augury, lang: Latin, literal: auspicia, category: religion, def: 'Taking the auspices: observing birds and other signs to discover whether the gods approved an action. Magistrates took auspices before assemblies and battles, and claims of bad omens could block business.', related: [pax-deorum]}
- {id: haruspex, term: haruspex, lang: Latin, category: religion, def: 'A diviner, of Etruscan tradition, who read the entrails of sacrificial animals and interpreted prodigies.', related: [augury]}
- {id: pax-deorum, term: pax deorum, lang: Latin, literal: peace of the gods, category: religion, def: 'The right relationship between Rome and its gods, maintained by correct ritual. Prodigies signalled its breakdown and called for expiation.', related: [augury, religio]}
- {id: religio, term: religio, lang: Latin, category: religion, def: 'Scrupulous observance of obligations to the gods; contrasted with superstitio, excessive or foreign religious practice. Christians reshaped both words.', related: [pax-deorum]}
- {id: imperial-cult, term: imperial cult, category: religion, def: 'Worship of deified emperors (divi) and of the living emperor''s genius or numen, organised by cities and provincial councils. It expressed loyalty and gave provincial elites a role; refusal to take part exposed Christians to danger.', related: [divus, genius]}
- {id: divus, term: divus, lang: Latin, literal: deified, category: religion, def: 'Title of an emperor declared a god by the Senate after death, beginning with Julius Caesar (Divus Iulius, 42 BC).', related: [imperial-cult]}
- {id: genius, term: genius, lang: Latin, category: religion, def: 'The divine spirit of a man, a family or a place. Oaths and offerings to the emperor''s genius were a common form of loyalty.', related: [imperial-cult, lares]}
- {id: lares, term: Lares and Penates, lang: Latin, category: religion, def: 'Household gods: the Lares protected house, crossroads and city, the Penates the storeroom. Their shrines (lararia) survive in many Pompeian houses.', related: [genius]}
- {id: damnatio-memoriae, term: damnatio memoriae, lang: Latin, literal: condemnation of memory, category: concept, def: 'A modern term for the official erasure of a disgraced person''s name and images from monuments, as with Domitian and Geta. The Romans had no single word for it, and erasures were often incomplete.', related: [divus]}
- {id: triumph, term: triumph, lang: Latin, literal: triumphus, category: religion, def: 'The procession of a victorious general through Rome to the temple of Jupiter on the Capitol. After 19 BC full triumphs were reserved for the imperial family.', related: [imperator]}
- {id: proscription, term: proscription, lang: Latin, literal: proscriptio, category: concept, def: 'The publication of lists of citizens who could be killed with impunity and whose property was confiscated: by Sulla in 82 BC and by the triumvirs in 43 BC, when Cicero was among the victims.', related: [dictator]}
- {id: pomerium, term: pomerium, lang: Latin, category: religion, def: 'The sacred boundary of the city of Rome. Military imperium lapsed when crossed, and armies were forbidden within it.', related: [imperium, triumph]}
- {id: euergetism, term: euergetism, lang: Greek, literal: doing good works, category: society, def: 'Modern term for public benefaction by the rich, such as buildings, games and food, in return for honour; the engine of urban life across the empire.', related: [decurion]}
- {id: forum, term: forum, lang: Latin, category: place, def: 'The public square of a Roman town, centre of politics, law, religion and commerce. The Forum Romanum was the heart of Republican politics.', related: [basilica]}
- {id: basilica, term: basilica, lang: Latin, category: place, def: 'A large covered hall for law courts and business. Christians adopted the form for churches after Constantine.', related: [forum]}
- {id: domus, term: domus, lang: Latin, category: society, def: 'A house, especially the town house of a well-off family, with atrium and peristyle; also the household as a social unit, including slaves.', related: [insula, paterfamilias]}
- {id: insula, term: insula, lang: Latin, literal: island, category: society, def: 'A city block, and in modern usage especially a multi-storey apartment building of the kind that housed most of Rome''s population.', related: [domus]}
- {id: villa, term: villa, lang: Latin, category: economy, def: 'A country estate, often combining a residence with agricultural production; from working farms to luxurious seaside retreats.', related: [latifundia]}
- {id: thermae, term: baths, lang: Latin, literal: 'thermae, balneae', category: society, def: 'Public bath complexes with cold, warm and hot rooms, central to Roman social life. Imperial thermae in Rome could hold thousands.', related: [aqueduct]}
- {id: aqueduct, term: aqueduct, lang: Latin, literal: aquaeductus, category: place, def: 'A channel carrying water by gravity from a source to a city, mostly underground, with arcades only where needed to cross valleys. Rome had eleven major aqueducts by the third century.', related: [thermae, opus-caementicium]}
- {id: opus-caementicium, term: Roman concrete, lang: Latin, literal: opus caementicium, category: economy, def: 'A mix of lime mortar, aggregate and (in central Italy) volcanic ash (pozzolana) that set even underwater. It made possible the vaults and domes of imperial architecture.', related: [aqueduct]}
- {id: munus, term: munus, lang: Latin, literal: 'duty, gift', category: society, def: 'A gladiatorial show, originally a funerary obligation; more generally any public duty or gift.', related: [euergetism]}
- {id: romanisation, term: Romanisation, category: historiography, def: 'The modern term for cultural change in the provinces under Roman rule. Criticised for implying a one-way process of civilising; alternatives stress negotiation, creolisation, discrepant experience or globalisation.', related: [romanitas, euergetism]}
- {id: romanitas, term: romanitas, lang: Latin, literal: Roman-ness, category: concept, def: 'Roman identity or way of life; a rare word in antiquity that became important in modern scholarship and in Fascist Italy.', related: [romanisation]}
- {id: barbarian, term: barbarian, lang: Greek, literal: 'barbaros, babbler', category: concept, def: 'Greek and Roman term for peoples outside their civilisation, carrying cultural rather than racial meaning, though often laden with stereotypes about savagery, environment and character.', related: [romanisation, ethnogenesis]}
- {id: ethnogenesis, term: ethnogenesis, category: historiography, def: 'The formation of a people. Applied to the Goths, Franks and others to argue that these groups formed through political processes, often on the Roman frontier, rather than descending unchanged from ancient tribes.', related: [barbarian, foederati]}
- {id: late-antiquity, term: Late Antiquity, category: historiography, def: 'The period from roughly the third to the seventh or eighth century, conceived since Peter Brown''s work as an era of transformation in its own right rather than decline.', related: [byzantine]}
- {id: byzantine, term: Byzantine, category: historiography, def: 'Modern label (popularised by the sixteenth-century scholar Hieronymus Wolf) for the eastern Roman empire, from the old name of Constantinople. Its inhabitants called themselves Romans (Rhomaioi).', related: [rhomaioi, late-antiquity]}
- {id: rhomaioi, term: Rhomaioi, lang: Greek, literal: Romans, category: concept, def: 'What the people of the eastern empire called themselves until 1453 and after; their state was the Romanía or "empire of the Romans".', related: [byzantine]}
- {id: themes, term: themes, lang: Greek, literal: themata, category: institution, def: 'Military-administrative districts of the middle Byzantine empire, named after the armies settled in them (Anatolikon, Armeniakon, Opsikion). Their origins in the seventh century are debated.', related: [strategos]}
- {id: strategos, term: strategos, lang: Greek, literal: general, category: office, def: 'Military governor of a Byzantine theme.', related: [themes]}
- {id: exarch, term: exarch, lang: Greek, category: office, def: 'Governor-general combining civil and military authority in late sixth- and seventh-century Italy (Ravenna) and Africa (Carthage).', related: [themes]}
- {id: bishop, term: bishop, lang: Greek, literal: 'episkopos, overseer', category: religion, def: 'Leader of a Christian community in a city. From the fourth century bishops became powerful urban figures with judicial and charitable roles.', related: [council]}
- {id: council, term: ecumenical council, category: religion, def: 'A council of bishops from across the empire, summoned by emperors to settle doctrine and discipline: Nicaea (325), Constantinople (381), Ephesus (431), Chalcedon (451) and later.', related: [bishop, arianism]}
- {id: arianism, term: Arianism, category: religion, def: 'The label opponents gave to theologies, associated with the priest Arius, that subordinated the Son to the Father. Condemned at Nicaea (325) but favoured by several emperors and adopted by the Goths and Vandals.', related: [council, nicene]}
- {id: nicene, term: Nicene Christianity, category: religion, def: 'Christianity affirming the Creed of Nicaea (325, revised 381) that the Son is "of one substance" (homoousios) with the Father; made the official orthodoxy by Theodosius I in 380.', related: [arianism, council]}
- {id: chalcedon, term: Chalcedonian and Miaphysite, category: religion, def: 'The division after the Council of Chalcedon (451) over how Christ''s divine and human natures are united. Many Christians in Egypt and Syria rejected Chalcedon, creating lasting divisions within the eastern empire.', related: [council]}
- {id: iconoclasm, term: iconoclasm, lang: Greek, literal: image-breaking, category: religion, def: 'Byzantine imperial policy against the veneration of religious images (c. 730–787 and 815–843). Its scale and motives have been substantially revised by recent scholarship.', related: [council]}
- {id: martyr, term: martyr, lang: Greek, literal: 'martys, witness', category: religion, def: 'A Christian who died for refusing to sacrifice or renounce the faith. Martyr stories (acta and passiones) are a key but often rewritten source for persecution.', related: [persecution]}
- {id: persecution, term: persecution, category: religion, def: 'Action by Roman authorities against Christians: sporadic and local until Decius (250), then empire-wide under Decius, Valerian (257–260) and the Great Persecution (303–311).', related: [martyr]}
- {id: chi-rho, term: Chi-Rho, lang: Greek, category: religion, def: 'The monogram of the first two letters of Christ''s name in Greek (Χ and Ρ), associated with Constantine''s vision and used on shields, standards (the labarum) and coins.', related: [labarum]}
- {id: labarum, term: labarum, category: religion, def: 'Constantine''s military standard bearing the Chi-Rho, described by Eusebius.', related: [chi-rho]}
- {id: pagan, term: pagan, lang: Latin, literal: 'paganus, civilian, rustic', category: historiography, def: 'Christian term for adherents of traditional polytheist cults, which lumped together very diverse practices. Many historians prefer "polytheist" or "traditional cults".', related: [religio]}
- {id: hellenisation, term: Hellenisation, category: concept, def: 'The adoption of Greek culture, language and practice; Rome was itself profoundly Hellenised, especially after the conquests of the second century BC.', related: [romanisation]}
- {id: stoicism, term: Stoicism, category: concept, def: 'Greek philosophy teaching that virtue is the only good and that one should live according to nature and reason; influential among the Roman elite from Cato to Seneca and Marcus Aurelius.', related: [hellenisation]}
- {id: declamation, term: declamation, lang: Latin, literal: declamatio, category: concept, def: 'Practice speeches on imaginary legal or historical cases, the summit of Roman rhetorical education and a popular entertainment.', related: [grammaticus]}
- {id: grammaticus, term: grammaticus, lang: Latin, category: society, def: 'Teacher of language and literature, the second stage of elite education between the elementary teacher and the rhetor.', related: [declamation]}
- {id: pax-romana, term: Pax Romana, lang: Latin, literal: Roman peace, category: concept, def: 'The relative internal peace of the empire from Augustus to the late second century. The phrase reflects a Roman view: peace was achieved by conquest and maintained by force.', related: [principate]}
- {id: colonus, term: colonus, lang: Latin, literal: 'cultivator, tenant', category: economy, def: 'A tenant farmer. Late Roman laws tied many coloni to the land for tax purposes; the reality of this "colonate" is now much debated.', related: [iugatio]}
- {id: interregnum, term: interrex, lang: Latin, category: office, def: 'A temporary holder of supreme power for five days when there were no consuls, appointed from among the patrician senators.', related: [consul]}
- {id: etruscans, term: Etruscans, category: society, def: 'The people of Etruria (Tuscany), whose cities shaped early Rome''s religion, architecture and politics; Roman tradition made the last three kings Etruscan.', related: [haruspex]}
