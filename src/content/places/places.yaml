# Coordinates are approximate (WGS84, to about 0.01°). Battle sites marked as uncertain where the location is debated.
- {id: rome, name: Rome, ancient: Roma, modern: Rome, lat: 41.8925, lon: 12.4853, kind: city, rank: 1, summary: 'The city on the Tiber at the lowest crossing point before the sea, controlling the salt route inland. Capital of the empire until the third century, when emperors increasingly ruled from frontier cities, it remained the symbolic heart of Roman identity.'}
- {id: ostia, name: Ostia, ancient: Ostia, lat: 41.7556, lon: 12.2922, kind: port, rank: 2, summary: 'Rome''s harbour town at the mouth of the Tiber. Its excavated apartment blocks, warehouses and guild offices are the best evidence for ordinary urban life outside Pompeii. Claudius and Trajan built a new harbour, Portus, nearby.'}
- {id: veii, name: Veii, ancient: Veii, lat: 42.0236, lon: 12.4013, kind: city, rank: 3, span: [-900, -396], summary: 'Wealthy Etruscan city 15 km north of Rome, captured after a long war in 396 BC (traditional date).'}
- {id: capua, name: Capua, ancient: Capua, modern: Santa Maria Capua Vetere, lat: 41.0834, lon: 14.2533, kind: city, rank: 2, summary: 'The great city of Campania, linked to Rome by the Via Appia. Its defection to Hannibal in 216 BC was the greatest blow to Rome''s alliance system; Spartacus'' revolt began in its gladiatorial school.'}
- {id: tarentum, name: Tarentum, ancient: Taras, modern: Taranto, lat: 40.4644, lon: 17.2470, kind: city, rank: 2, summary: 'Greek city in southern Italy which called in Pyrrhus against Rome in 280 BC.'}
- {id: brundisium, name: Brundisium, modern: Brindisi, lat: 40.6380, lon: 17.9460, kind: port, rank: 2, summary: 'The terminus of the Via Appia and Rome''s port for Greece and the East.'}
- {id: pompeii, name: Pompeii, lat: 40.7490, lon: 14.4840, kind: city, rank: 2, span: [-600, 79], summary: 'A Campanian town of perhaps 10,000–12,000 people buried by Vesuvius in AD 79. Its houses, shops, graffiti and election notices are unique evidence, but it was a provincial town caught at one moment, after an earthquake in 62/63.', events: [vesuvius]}
- {id: herculaneum, name: Herculaneum, lat: 40.8060, lon: 14.3480, kind: city, rank: 3, span: [-500, 79], summary: 'Smaller and richer than Pompeii, buried under deep volcanic flows that preserved wood, food and the carbonised papyrus library of the Villa of the Papyri.'}
- {id: misenum, name: Misenum, lat: 40.7800, lon: 14.0800, kind: port, rank: 3, summary: 'Base of the western imperial fleet, commanded in AD 79 by Pliny the Elder.'}
- {id: tibur, name: Tibur, modern: Tivoli, lat: 41.9420, lon: 12.7750, kind: site, rank: 3, summary: 'Hill town near Rome; site of Hadrian''s vast villa, an architectural laboratory recreating places from across his empire.'}
- {id: capri, name: Capreae, modern: Capri, lat: 40.5510, lon: 14.2430, kind: site, rank: 3, summary: 'Island where Tiberius lived from AD 26 to 37, governing by letter.'}
- {id: rubicon, name: River Rubicon, lat: 44.0910, lon: 12.3990, kind: site, rank: 3, span: [-60, -40], summary: 'The small river marking the boundary between Cisalpine Gaul and Italy. A governor who led troops across it with imperium broke the law; Caesar did so in January 49 BC. Its exact modern identification was long disputed.'}
- {id: ravenna, name: Ravenna, lat: 44.4184, lon: 12.2035, kind: city, rank: 2, summary: 'Port of the Adriatic fleet, protected by marshes, and capital of the western emperors from 402, then of Odoacer, Theoderic and the Byzantine exarchs. Its churches preserve the mosaics of Justinian and Theodora.'}
- {id: mediolanum, name: Mediolanum, modern: Milan, lat: 45.4642, lon: 9.1900, kind: city, rank: 2, summary: 'Imperial residence of Maximian and later western emperors, close to the Alpine passes; Ambrose''s see.'}
- {id: aquileia, name: Aquileia, lat: 45.7700, lon: 13.3700, kind: city, rank: 2, summary: 'Great trading city at the head of the Adriatic guarding the route to the Danube; besieged by the Marcomanni, by Maximinus in 238, and sacked by Attila in 452.'}
- {id: syracuse, name: Syracuse, ancient: Syracusae, lat: 37.0755, lon: 15.2866, kind: city, rank: 2, summary: 'The great Greek city of Sicily, Rome''s ally in the First Punic War, captured in 211 BC after defecting (Archimedes died in the sack).'}
- {id: messana, name: Messana, modern: Messina, lat: 38.1938, lon: 15.5540, kind: city, rank: 3, summary: 'Sicilian city held by Italian mercenaries whose appeal for help in 264 BC drew Rome into the First Punic War.'}
- {id: carthage, name: Carthage, ancient: Carthago, lat: 36.8528, lon: 10.3233, kind: city, rank: 1, summary: 'Phoenician foundation that dominated the western Mediterranean until destroyed by Rome in 146 BC. Refounded as a Roman colony by Caesar and Augustus, it became the second city of the Latin West, then the Vandal capital (439–533) and a Byzantine exarchate until 698.'}
- {id: utica, name: Utica, lat: 37.0567, lon: 10.0611, kind: city, rank: 3, summary: 'First capital of the Roman province of Africa; Cato the Younger killed himself here in 46 BC.'}
- {id: hippo-regius, name: Hippo Regius, modern: Annaba, lat: 36.8820, lon: 7.7490, kind: city, rank: 3, summary: 'African port city where Augustine was bishop; he died during the Vandal siege of 430.'}
- {id: timgad, name: Thamugadi, modern: Timgad, lat: 35.4840, lon: 6.4680, kind: city, rank: 3, span: [100, 700], summary: 'Veteran colony founded by Trajan in AD 100 on a near-perfect grid; a model of Roman planning on the African frontier.'}
- {id: lepcis-magna, name: Lepcis Magna, lat: 32.6390, lon: 14.2930, kind: city, rank: 2, summary: 'Phoenician-Libyan city in Tripolitania, birthplace of Septimius Severus, who lavished buildings on it.'}
- {id: cyrene, name: Cyrene, lat: 32.8250, lon: 21.8580, kind: city, rank: 3, summary: 'Greek city of Libya, bequeathed to Rome in 96 BC.'}
- {id: alexandria, name: Alexandria, ancient: Alexandreia, lat: 31.2001, lon: 29.9187, kind: city, rank: 1, summary: 'Alexander''s city, Ptolemaic capital and the second city of the empire: the great grain port for Rome and later Constantinople, home of the Museum and Library, of a large Jewish community and of a powerful patriarchate. Lost to the Arabs in 641/642.'}
- {id: oxyrhynchus, name: Oxyrhynchus, modern: el-Bahnasa, lat: 28.5350, lon: 30.6560, kind: city, rank: 3, summary: 'Middle Egyptian town whose rubbish mounds have yielded hundreds of thousands of papyrus fragments: petitions, tax receipts, letters, contracts and lost literature.'}
- {id: berenike, name: Berenike, lat: 23.9100, lon: 35.4730, kind: port, rank: 3, span: [-275, 550], summary: 'Red Sea port through which Roman trade with India and East Africa passed; excavations have found Indian pepper, teak and coins.'}
- {id: jerusalem, name: Jerusalem, ancient: 'Hierosolyma, Aelia Capitolina', lat: 31.7780, lon: 35.2354, kind: city, rank: 1, summary: 'Taken by Pompey in 63 BC; its Temple was destroyed by Titus in AD 70, and Hadrian refounded it as the colony Aelia Capitolina. Under Constantine it became the Christian holy city, captured by Persia in 614 and by the Arabs in 638.'}
- {id: caesarea-maritima, name: Caesarea Maritima, lat: 32.5000, lon: 34.8920, kind: port, rank: 3, summary: 'Herod''s harbour city and the Roman provincial capital of Judaea; Eusebius was its bishop.'}
- {id: masada, name: Masada, lat: 31.3156, lon: 35.3536, kind: site, rank: 3, span: [-30, 74], summary: 'Herod''s desert fortress, the last stronghold of the Jewish revolt, taken by the Romans in 73 or 74. The Roman siege works are the best preserved anywhere.'}
- {id: antioch, name: Antioch, ancient: Antiocheia, modern: Antakya, lat: 36.2021, lon: 36.1600, kind: city, rank: 1, summary: 'Seleucid capital and the great city of Roman Syria, base for eastern campaigns and an early centre of Christianity; sacked by Shapur I and by Khosrow I in 540.'}
- {id: palmyra, name: Palmyra, ancient: Tadmor, lat: 34.5510, lon: 38.2690, kind: city, rank: 2, summary: 'Caravan city in the Syrian desert whose merchants linked the Euphrates to the Mediterranean; under Odaenathus and Zenobia it briefly ruled the Roman East (260–272).'}
- {id: dura-europos, name: Dura-Europos, lat: 34.7470, lon: 40.7300, kind: city, rank: 3, span: [-300, 256], summary: 'Frontier town on the Euphrates destroyed by the Persians c. 256. Its excavated synagogue, house-church, temples and military documents give a cross-section of a multicultural garrison town.'}
- {id: edessa, name: Edessa, modern: Şanlıurfa, lat: 37.1591, lon: 38.7969, kind: city, rank: 2, summary: 'Capital of Osrhoene and a centre of Syriac Christianity; Valerian was captured nearby in 260.'}
- {id: carrhae, name: Carrhae, modern: Harran, lat: 36.8640, lon: 39.0310, kind: battle, span: [-53, -53], summary: 'Site of Crassus'' catastrophic defeat by the Parthians in 53 BC.'}
- {id: nisibis, name: Nisibis, modern: Nusaybin, lat: 37.0700, lon: 41.2150, kind: city, rank: 3, summary: 'Fortress city on the Roman-Persian frontier, ceded to Persia by Jovian in 363 after Julian''s death.'}
- {id: dara, name: Dara, lat: 37.1730, lon: 40.9370, kind: city, rank: 3, span: [505, 640], summary: 'Fortress built by Anastasius facing Nisibis; site of Belisarius'' victory over Persia in 530.'}
- {id: ctesiphon, name: Ctesiphon, lat: 33.0936, lon: 44.5808, kind: city, rank: 1, summary: 'Capital of the Parthian and Sasanian kings on the Tigris, sacked by Roman armies under Trajan, Verus and Severus, and the target of Julian''s campaign in 363.'}
- {id: pergamum, name: Pergamum, lat: 39.1320, lon: 27.1840, kind: city, rank: 2, summary: 'Attalid capital bequeathed to Rome in 133 BC; its kingdom became the province of Asia. Galen''s birthplace.'}
- {id: ephesus, name: Ephesus, lat: 37.9411, lon: 27.3419, kind: city, rank: 2, summary: 'Governor''s seat of Asia and one of the largest cities of the empire, with the temple of Artemis and a famous theatre.'}
- {id: nicomedia, name: Nicomedia, modern: İzmit, lat: 40.7654, lon: 29.9408, kind: city, rank: 2, summary: 'Capital of Bithynia, where Pliny dealt with fire brigades and aqueducts; Diocletian''s main residence, where the Great Persecution began in 303.'}
- {id: nicaea, name: Nicaea, modern: İznik, lat: 40.4292, lon: 29.7211, kind: city, rank: 2, summary: 'Bithynian city where Constantine''s council met in 325; capital of the Byzantine empire in exile from 1204 to 1261.'}
- {id: ancyra, name: Ancyra, modern: Ankara, lat: 39.9334, lon: 32.8597, kind: city, rank: 3, summary: 'Capital of Galatia; the walls of its temple of Rome and Augustus preserve the most complete copy of the Res Gestae.'}
- {id: constantinople, name: Constantinople, ancient: Byzantion / Constantinopolis, modern: Istanbul, lat: 41.0086, lon: 28.9802, kind: city, rank: 1, summary: 'Greek Byzantion, refounded by Constantine in 324–330 as the new capital. Protected by water on three sides and the Theodosian Walls on the fourth, it was the capital of the Roman empire until 1453, captured only in 1204 and 1453.'}
- {id: trebizond, name: Trebizond, ancient: Trapezus, modern: Trabzon, lat: 41.0050, lon: 39.7300, kind: city, rank: 2, summary: 'Black Sea port; seat of the Komnenian "Empire of Trebizond" from 1204 until its fall to Mehmed II in 1461.'}
- {id: athens, name: Athens, lat: 37.9715, lon: 23.7267, kind: city, rank: 1, summary: 'Under Rome a university town and cultural capital patronised by emperors from Augustus to Hadrian, sacked by the Heruli in 267.'}
- {id: corinth, name: Corinth, lat: 37.9057, lon: 22.8790, kind: city, rank: 2, summary: 'Destroyed by Rome in 146 BC, refounded as a colony by Caesar, and capital of the province of Achaea.'}
- {id: thessalonica, name: Thessalonica, lat: 40.6401, lon: 22.9444, kind: city, rank: 2, summary: 'Capital of Macedonia on the Via Egnatia; Galerius'' residence, with his arch and rotunda; second city of the Byzantine empire.'}
- {id: mistra, name: Mistra, lat: 37.0730, lon: 22.3670, kind: city, rank: 3, span: [1249, 1460], summary: 'Capital of the Byzantine Despotate of the Morea, an intellectual centre in the last Byzantine century.'}
- {id: serdica, name: Serdica, modern: Sofia, lat: 42.6977, lon: 23.3219, kind: city, rank: 3, summary: 'Capital of Dacia Mediterranea and an imperial residence under Constantine.'}
- {id: naissus, name: Naissus, modern: Niš, lat: 43.3209, lon: 21.8958, kind: city, rank: 3, summary: 'Birthplace of Constantine; Claudius II defeated the Goths nearby in 268 or 269.'}
- {id: sirmium, name: Sirmium, modern: Sremska Mitrovica, lat: 44.9700, lon: 19.6100, kind: city, rank: 2, summary: 'Imperial residence on the Sava, base for Danubian campaigns from Marcus Aurelius to the tetrarchs.'}
- {id: sarmizegetusa, name: Sarmizegetusa Regia, lat: 45.6230, lon: 23.3100, kind: city, rank: 3, span: [-100, 106], summary: 'Mountain capital of the Dacian kings, destroyed by Trajan in 106.'}
- {id: aquincum, name: Aquincum, modern: Budapest, lat: 47.5640, lon: 19.0490, kind: city, rank: 3, span: [40, 450], summary: 'Legionary fortress and capital of Lower Pannonia on the Danube frontier.'}
- {id: carnuntum, name: Carnuntum, lat: 48.1100, lon: 16.8650, kind: city, rank: 3, span: [6, 450], summary: 'Legionary fortress and city on the Danube where Marcus Aurelius wrote part of the Meditations and where the tetrarchs met in 308.'}
- {id: vindobona, name: Vindobona, modern: Vienna, lat: 48.2082, lon: 16.3738, kind: city, rank: 3, span: [90, 450], summary: 'Danube legionary fortress; Marcus Aurelius may have died here or at Sirmium in 180.'}
- {id: trier, name: Augusta Treverorum, modern: Trier, lat: 49.7500, lon: 6.6400, kind: city, rank: 2, summary: 'Capital of the Gallic Empire and of Constantius I and Constantine, with a vast basilica and baths; the late Roman capital of the north-west.'}
- {id: mainz, name: Mogontiacum, modern: Mainz, lat: 49.9929, lon: 8.2473, kind: city, rank: 3, summary: 'Legionary base and capital of Upper Germany on the Rhine; Severus Alexander was murdered nearby in 235.'}
- {id: cologne, name: Colonia Agrippinensis, modern: Cologne, lat: 50.9375, lon: 6.9603, kind: city, rank: 2, summary: 'Capital of Lower Germany, named after Agrippina the Younger who was born there.'}
- {id: lugdunum, name: Lugdunum, modern: Lyon, lat: 45.7600, lon: 4.8200, kind: city, rank: 2, span: [-43, 1460], summary: 'Founded in 43 BC, capital of the Three Gauls with the altar of Rome and Augustus and an imperial mint; Claudius was born here, and his speech on Gallic senators was displayed here on bronze.'}
- {id: lutetia, name: Lutetia, modern: Paris, lat: 48.8530, lon: 2.3490, kind: city, rank: 3, summary: 'Town of the Parisii, where Julian was proclaimed Augustus in 360.'}
- {id: massilia, name: Massilia, modern: Marseille, lat: 43.2965, lon: 5.3698, kind: port, rank: 2, summary: 'Greek colony and long-standing ally of Rome, besieged by Caesar in 49 BC.'}
- {id: narbo, name: Narbo Martius, modern: Narbonne, lat: 43.1840, lon: 3.0040, kind: city, rank: 3, summary: 'Rome''s first colony outside Italy (118 BC), capital of Gallia Narbonensis.'}
- {id: arelate, name: Arelate, modern: Arles, lat: 43.6766, lon: 4.6278, kind: city, rank: 3, summary: 'Rhône port that rose to prominence in late antiquity as the seat of the Gallic prefecture.'}
- {id: nemausus, name: Nemausus, modern: Nîmes, lat: 43.8367, lon: 4.3601, kind: city, rank: 3, summary: 'City of Narbonensis supplied by the aqueduct that crosses the Gardon on the Pont du Gard.'}
- {id: londinium, name: Londinium, modern: London, lat: 51.5130, lon: -0.0890, kind: city, rank: 2, span: [47, 1460], summary: 'Founded soon after the invasion of 43 as a trading settlement at the Thames crossing; burned by Boudica, rebuilt as the capital of Britain.'}
- {id: camulodunum, name: Camulodunum, modern: Colchester, lat: 51.8890, lon: 0.9010, kind: city, rank: 3, summary: 'British royal centre captured in 43, made a veteran colony with a temple to Claudius, destroyed by Boudica in 60/61.'}
- {id: eboracum, name: Eboracum, modern: York, lat: 53.9590, lon: -1.0815, kind: city, rank: 2, span: [71, 1460], summary: 'Legionary fortress where Septimius Severus died (211) and Constantine was proclaimed (306).'}
- {id: vindolanda, name: Vindolanda, lat: 54.9910, lon: -2.3600, kind: site, rank: 3, span: [85, 410], summary: 'Fort just south of Hadrian''s Wall whose waterlogged deposits preserved hundreds of wooden writing tablets of c. AD 90–120.'}
- {id: hadrians-wall, name: Hadrian's Wall, lat: 55.0130, lon: -2.3310, kind: frontier, rank: 2, span: [122, 410], summary: 'Begun c. 122 from the Tyne to the Solway, with milecastles, turrets and forts such as Housesteads. A system for controlling and taxing movement as much as for defence.'}
- {id: antonine-wall, name: Antonine Wall, lat: 55.9800, lon: -4.0500, kind: frontier, rank: 3, span: [142, 165], summary: 'Turf rampart between the Forth and Clyde built under Antoninus Pius and abandoned within a generation.'}
- {id: tarraco, name: Tarraco, modern: Tarragona, lat: 41.1189, lon: 1.2445, kind: city, rank: 2, summary: 'Roman base from the Second Punic War and capital of Hispania Tarraconensis.'}
- {id: saguntum, name: Saguntum, modern: Sagunto, lat: 39.6797, lon: -0.2733, kind: city, rank: 3, summary: 'Iberian town allied to Rome whose capture by Hannibal in 219 BC was the pretext for the Second Punic War.'}
- {id: new-carthage, name: New Carthage, ancient: Carthago Nova, modern: Cartagena, lat: 37.6000, lon: -0.9860, kind: city, rank: 2, summary: 'Barcid capital in Spain near rich silver mines, taken by Scipio in 209 BC.'}
- {id: gades, name: Gades, modern: Cádiz, lat: 36.5297, lon: -6.2920, kind: port, rank: 2, summary: 'Ancient Phoenician port on the Atlantic, one of the richest cities of the early empire.'}
- {id: corduba, name: Corduba, modern: Córdoba, lat: 37.8847, lon: -4.7792, kind: city, rank: 3, summary: 'Capital of Baetica, home of the Senecas. The Guadalquivir valley exported olive oil to Rome on a vast scale.'}
- {id: emerita, name: Emerita Augusta, modern: Mérida, lat: 38.9161, lon: -6.3437, kind: city, rank: 3, span: [-25, 1460], summary: 'Veteran colony founded in 25 BC, capital of Lusitania.'}
- {id: numantia, name: Numantia, lat: 41.8100, lon: -2.4440, kind: city, rank: 3, span: [-300, -133], summary: 'Celtiberian hill town that resisted Rome for twenty years until starved out by Scipio Aemilianus in 133 BC; his siege works survive.'}
- {id: spalatum, name: Diocletian's Palace, modern: Split, lat: 43.5081, lon: 16.4402, kind: site, rank: 3, span: [305, 1460], summary: 'The fortified palace on the Dalmatian coast to which Diocletian retired in 305; the medieval town grew inside it.'}
- {id: heraclea, name: Heraclea, lat: 40.2125, lon: 16.6770, kind: battle, span: [-280, -280], summary: 'Pyrrhus'' first victory over Rome, 280 BC.'}
- {id: mylae, name: Mylae, modern: Milazzo, lat: 38.2210, lon: 15.2420, kind: battle, span: [-260, -260], summary: 'Rome''s first great naval victory, 260 BC.'}
- {id: aegates, name: Aegates Islands, lat: 37.9700, lon: 12.2000, kind: battle, span: [-241, -241], summary: 'Naval victory that ended the First Punic War, 241 BC. Underwater archaeology has recovered bronze warship rams from the battle site.'}
- {id: trebia, name: River Trebia, lat: 45.0500, lon: 9.6000, kind: battle, span: [-218, -218], summary: 'Hannibal''s first major victory in Italy, December 218 BC.', locationNote: 'Approximate.'}
- {id: trasimene, name: Lake Trasimene, lat: 43.1800, lon: 12.0700, kind: battle, span: [-217, -217], summary: 'Ambush of a consular army on the lake shore, 217 BC.', locationNote: 'Exact site on the northern shore debated.'}
- {id: cannae, name: Cannae, lat: 41.3063, lon: 16.1325, kind: battle, span: [-216, -216], summary: 'Hannibal''s greatest victory, August 216 BC.', locationNote: 'The battle was fought near the Aufidus (Ofanto); which bank is debated.'}
- {id: metaurus, name: River Metaurus, lat: 43.7200, lon: 12.9500, kind: battle, span: [-207, -207], summary: 'Defeat and death of Hasdrubal, 207 BC.', locationNote: 'Approximate.'}
- {id: zama, name: Zama, lat: 36.1500, lon: 9.3500, kind: battle, span: [-202, -202], summary: 'Scipio''s victory over Hannibal, 202 BC.', locationNote: 'The battlefield is not securely identified; Polybius places it near Margaron.'}
- {id: cynoscephalae, name: Cynoscephalae, lat: 39.4300, lon: 22.6000, kind: battle, span: [-197, -197], summary: 'Legion defeated phalanx; Philip V of Macedon beaten, 197 BC.'}
- {id: magnesia, name: Magnesia ad Sipylum, modern: Manisa, lat: 38.6200, lon: 27.4300, kind: battle, span: [-190, -190], summary: 'Defeat of Antiochus III, 190/189 BC.'}
- {id: pydna, name: Pydna, lat: 40.3700, lon: 22.6200, kind: battle, span: [-168, -168], summary: 'End of the Macedonian monarchy, 168 BC.'}
- {id: arausio, name: Arausio, modern: Orange, lat: 44.1381, lon: 4.8076, kind: battle, span: [-105, -105], summary: 'Destruction of two Roman armies by the Cimbri and Teutones, 105 BC.'}
- {id: aquae-sextiae, name: Aquae Sextiae, modern: Aix-en-Provence, lat: 43.5297, lon: 5.4474, kind: battle, span: [-102, -102], summary: 'Marius'' victory over the Teutones, 102 BC.'}
- {id: alesia, name: Alesia, lat: 47.5373, lon: 4.5003, kind: battle, span: [-52, -52], summary: 'Caesar''s siege and victory over Vercingetorix, 52 BC; excavations at Alise-Sainte-Reine found his siege lines.'}
- {id: pharsalus, name: Pharsalus, lat: 39.3000, lon: 22.3800, kind: battle, span: [-48, -48], summary: 'Caesar''s decisive victory over Pompey, 48 BC.', locationNote: 'Approximate.'}
- {id: philippi, name: Philippi, lat: 41.0130, lon: 24.2860, kind: battle, span: [-42, -42], summary: 'Defeat of Brutus and Cassius, 42 BC.'}
- {id: actium, name: Actium, lat: 38.9500, lon: 20.7500, kind: battle, span: [-31, -31], summary: 'Defeat of Antony and Cleopatra, 31 BC. Octavian founded Nicopolis ("Victory City") nearby.'}
- {id: teutoburg, name: Teutoburg Forest (Kalkriese), lat: 52.4086, lon: 8.1290, kind: battle, span: [9, 9], summary: 'Destruction of Varus'' three legions, AD 9.', locationNote: 'Finds at Kalkriese, including weapons and coins ending around AD 9, make it the most likely site; some scholars remain doubtful.'}
- {id: bedriacum, name: Bedriacum, lat: 45.1300, lon: 10.4400, kind: battle, span: [69, 69], summary: 'Two battles in AD 69 between Otho and Vitellius, then Vitellius and Vespasian.', locationNote: 'Approximate, near Cremona.'}
- {id: abritus, name: Abritus, modern: Razgrad, lat: 43.5260, lon: 26.5300, kind: battle, span: [251, 251], summary: 'Death of Decius fighting the Goths, 251.'}
- {id: milvian-bridge, name: Milvian Bridge, lat: 41.9356, lon: 12.4672, kind: battle, span: [312, 312], summary: 'Constantine''s victory over Maxentius on the Tiber north of Rome, 312.'}
- {id: adrianople, name: Adrianople, ancient: Hadrianopolis, modern: Edirne, lat: 41.6771, lon: 26.5557, kind: city, rank: 2, summary: 'Hadrian''s foundation in Thrace. Constantine defeated Licinius here in 324; the Goths destroyed Valens'' army nearby in 378.', events: [adrianople, chrysopolis]}
- {id: frigidus, name: River Frigidus, lat: 45.8800, lon: 13.9000, kind: battle, span: [394, 394], summary: 'Theodosius defeated Eugenius, 394.', locationNote: 'Probably in the Vipava valley; approximate.'}
- {id: catalaunian-plains, name: Catalaunian Plains, lat: 48.9000, lon: 4.4000, kind: battle, span: [451, 451], summary: 'Aetius'' coalition checked Attila, 451.', locationNote: 'Location uncertain, somewhere between Châlons and Troyes.'}
- {id: yarmuk, name: River Yarmuk, lat: 32.8000, lon: 35.9500, kind: battle, span: [636, 636], summary: 'Decisive Arab victory over the Roman army, 636.'}
- {id: manzikert, name: Manzikert, modern: Malazgirt, lat: 39.1450, lon: 42.5300, kind: battle, span: [1071, 1071], summary: 'Defeat and capture of Romanos IV by the Seljuks, 1071.'}
