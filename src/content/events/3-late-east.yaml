- {id: diocletian-accession, title: 'Accession of Diocletian', date: {from: 284}, themes: [political], weight: 3, summary: 'The army in the East acclaimed the Dalmatian officer Diocles, who would rule for over twenty years.', causes: [aurelian-reunites], figures: [diocletian], places: [nicomedia], lesson: diocletian, certainty: established}
- {id: tetrarchy-formed, title: 'The Tetrarchy formed', date: {from: 293}, themes: [political], weight: 3, summary: 'Diocletian and Maximian as Augusti appointed Galerius and Constantius as Caesars, creating a college of four emperors with regional responsibilities.', causes: [diocletian-accession], figures: [diocletian, maximian, galerius, constantius-i], places: [nicomedia, trier, mediolanum, sirmium], sources: [tetrarchs-porphyry], lesson: diocletian, certainty: established}
- {id: persian-peace-298, title: 'Galerius defeats Persia', date: {from: 298}, themes: [military], weight: 1, summary: 'A decisive victory and the peace of Nisibis gave Rome territory beyond the Tigris and decades of eastern security.', causes: [tetrarchy-formed], figures: [galerius], places: [nisibis], lesson: diocletian, certainty: established}
- {id: price-edict-ev, title: 'Edict on Maximum Prices', date: {from: 301}, themes: [economic, legal], weight: 2, summary: 'The tetrarchs set maximum prices for over a thousand goods and services, on pain of death. Copies survive in fragments, mostly from the Greek East. It seems to have been unenforceable.', causes: [debasement-260s, tetrarchy-formed], figures: [diocletian], sources: [price-edict], lesson: diocletian, certainty: established}
- {id: great-persecution, title: 'Great Persecution', date: {from: 303, to: 311}, themes: [religious, political], weight: 3, summary: 'Edicts ordered the destruction of churches and scriptures, the arrest of clergy and finally sacrifice by all. Enforcement varied by region; it was most severe in the East.', causes: [tetrarchy-formed], figures: [diocletian, galerius, eusebius, lactantius], places: [nicomedia], lesson: christianisation, certainty: established}
- {id: abdication-305, title: 'Diocletian and Maximian abdicate', date: {from: 305}, themes: [political], weight: 2, summary: 'The two Augusti retired; Galerius and Constantius became Augusti, with new Caesars who excluded the sons of Maximian and Constantius.', causes: [tetrarchy-formed], figures: [diocletian, maximian], places: [nicomedia, spalatum], lesson: diocletian, certainty: established}
- {id: constantine-proclaimed, title: 'Constantine proclaimed at York', date: {from: 306}, themes: [political, military], weight: 3, summary: 'On his father''s death the army in Britain acclaimed Constantine; in Rome Maxentius seized power. The tetrarchic system began to unravel.', causes: [abdication-305], figures: [constantine, constantius-i, maxentius], places: [eboracum], lesson: constantine, certainty: established}
- {id: galerius-toleration, title: 'Galerius'' edict of toleration', date: {from: 311}, themes: [religious, legal], weight: 2, summary: 'Dying, Galerius allowed Christians to meet again, on condition they prayed for the emperors and the state.', causes: [great-persecution], figures: [galerius], places: [nicomedia], sources: [lactantius-vision], lesson: christianisation, certainty: established}
- {id: milvian-bridge, title: 'Battle of the Milvian Bridge', date: {from: 312, label: '28 October 312'}, themes: [military, religious], weight: 3, summary: 'Constantine defeated Maxentius outside Rome after, by his own later account, a vision that led him to fight under a Christian sign.', causes: [constantine-proclaimed], figures: [constantine, maxentius, lactantius, eusebius], places: [milvian-bridge, rome], sources: [lactantius-vision, eusebius-vision], lesson: constantine, certainty: established}
- {id: milan-313, title: '"Edict of Milan"', date: {from: 313}, themes: [religious, legal], weight: 3, summary: 'Constantine and Licinius agreed at Milan on freedom of worship for all and restitution of Christian property. The text survives as a letter issued by Licinius in the East.', causes: [milvian-bridge, galerius-toleration], figures: [constantine, licinius], places: [mediolanum], sources: [milan-letter], lesson: constantine, certainty: established}
- {id: chrysopolis, title: 'Constantine defeats Licinius', date: {from: 324}, themes: [military, political], weight: 2, summary: 'Victories at Adrianople and Chrysopolis made Constantine sole emperor.', causes: [milan-313], figures: [constantine, licinius], places: [adrianople, constantinople], lesson: constantine, certainty: established}
- {id: nicaea-council, title: 'Council of Nicaea', date: {from: 325}, themes: [religious, political], weight: 3, summary: 'Constantine summoned bishops from across the empire to settle the Arian controversy and the date of Easter; the creed declared the Son "of one substance" with the Father.', causes: [chrysopolis], figures: [constantine, eusebius], places: [nicaea], lesson: constantine, certainty: established}
- {id: constantinople-founded, title: 'Constantinople dedicated', date: {from: 330, label: '11 May 330', note: 'Refoundation began in 324.'}, themes: [political, religious], weight: 3, summary: 'Constantine refounded Byzantium as his city, with a senate, grain dole and churches. It would be the capital of the Roman empire for eleven centuries.', causes: [chrysopolis], figures: [constantine], places: [constantinople], lesson: constantine, certainty: established}
- {id: julian-reign, title: 'Julian restores the traditional cults', date: {from: 361, to: 363}, themes: [religious, political], weight: 2, summary: 'The last non-Christian emperor reopened temples and barred Christians from teaching classical texts; he died on campaign in Persia.', causes: [constantinople-founded], figures: [julian, constantius-ii, ammianus], places: [constantinople, ctesiphon], lesson: christianisation, certainty: established}
- {id: gothic-crossing, title: 'The Goths cross the Danube', date: {from: 376}, themes: [military, social], weight: 3, summary: 'Under pressure from the Huns, Gothic Tervingi were admitted into the empire. Mismanagement and exploitation by Roman officials turned refugees into rebels.', figures: [valens], sources: [ammianus-adrianople], lesson: goths-adrianople, certainty: established}
- {id: adrianople, title: 'Battle of Adrianople', date: {from: 378, label: '9 August 378'}, themes: [military], weight: 3, summary: 'Valens attacked the Gothic camp without waiting for western reinforcements; he and perhaps two-thirds of his army were killed. Ammianus compared it to Cannae.', causes: [gothic-crossing], figures: [valens, ammianus], places: [adrianople], sources: [ammianus-adrianople], lesson: goths-adrianople, certainty: established}
- {id: cunctos-populos-ev, title: 'Theodosius defines orthodoxy', date: {from: 380}, themes: [religious, legal], weight: 2, summary: 'The edict Cunctos populos commanded all peoples to follow the faith of the bishops of Rome and Alexandria, branding others heretics.', figures: [theodosius-i], places: [thessalonica], sources: [cunctos-populos], lesson: christianisation, certainty: established}
- {id: gothic-treaty-382, title: 'Gothic settlement of 382', date: {from: 382}, themes: [political, military], weight: 2, summary: 'Theodosius ended the war by settling the Goths in the Balkans as a semi-autonomous group obliged to serve in the army. Historians debate how novel this "federate" arrangement was.', causes: [adrianople], figures: [theodosius-i], lesson: goths-adrianople, certainty: contested}
- {id: sacrifice-banned, title: 'Public sacrifice banned; Serapeum destroyed', date: {from: 391, to: 392}, themes: [religious, legal], weight: 2, summary: 'Theodosian laws banned sacrifice and temple visits; in Alexandria Christians destroyed the great temple of Serapis.', causes: [cunctos-populos-ev], figures: [theodosius-i], places: [alexandria], lesson: christianisation, certainty: established}
- {id: frigidus, title: 'Battle of the Frigidus', date: {from: 394}, themes: [military, religious], weight: 1, summary: 'Theodosius defeated the western usurper Eugenius, whose supporters included prominent non-Christian aristocrats; later Christian writers made it a holy war.', causes: [sacrifice-banned], figures: [theodosius-i, alaric], places: [frigidus], lesson: goths-adrianople, certainty: interpretation}
- {id: division-395, title: 'Death of Theodosius; empire divided between his sons', date: {from: 395}, themes: [political], weight: 3, summary: 'Arcadius ruled from Constantinople and Honorius from Milan (later Ravenna). Contemporaries saw one empire with two courts; in practice the halves drifted apart.', causes: [frigidus], figures: [theodosius-i, arcadius, honorius, stilicho], lesson: goths-adrianople, certainty: established}
- {id: theodosian-walls, title: 'Theodosian Land Walls of Constantinople', date: {from: 413, to: 447, label: 'completed 413, rebuilt 447'}, themes: [military], weight: 2, summary: 'A triple line of moat, outer wall and inner wall with 96 towers protected Constantinople''s landward side. They held until 1204 (taken from the sea side) and 1453.', causes: [adrianople], figures: [theodosius-ii], places: [constantinople], lesson: fall-of-the-west, certainty: established}
- {id: rhine-crossing, title: 'Vandals, Alans and Sueves cross the Rhine', date: {from: 406, label: '31 December 406', note: 'Some historians argue for 405; the source tradition is confused.'}, themes: [military], weight: 3, summary: 'Groups crossed into Gaul and later Spain. Usurpers in Britain and Gaul followed, and Roman government in Britain ended around 409–410.', causes: [division-395], figures: [stilicho], places: [mainz], lesson: goths-adrianople, certainty: contested}
- {id: stilicho-executed, title: 'Execution of Stilicho', date: {from: 408}, themes: [political], weight: 2, summary: 'Honorius had his generalissimo killed; massacres of the families of barbarian soldiers drove thousands to join Alaric.', causes: [rhine-crossing], figures: [stilicho, honorius, alaric], places: [ravenna], lesson: goths-adrianople, certainty: established}
- {id: sack-410, title: 'Alaric sacks Rome', date: {from: 410, label: '24–27 August 410'}, themes: [military, religious], weight: 3, summary: 'After failed negotiations for land and office, Alaric''s Goths sacked Rome for three days. The shock was symbolic and prompted Augustine''s City of God.', causes: [stilicho-executed], figures: [alaric, honorius, augustine, galla-placidia], places: [rome], sources: [jerome-410], lesson: goths-adrianople, certainty: established}
- {id: britain-end, title: 'End of Roman government in Britain', date: {from: 409, to: 411, circa: true}, themes: [political], weight: 2, summary: 'After usurpers took the army to Gaul, the Britons expelled Roman officials. The so-called "rescript of Honorius" telling the cities to look to their own defence may refer to Bruttium in Italy, not Britain.', causes: [rhine-crossing], places: [londinium], lesson: fall-of-the-west, certainty: contested}
- {id: aquitaine-418, title: 'Goths settled in Aquitaine', date: {from: 418}, themes: [political, military], weight: 2, summary: 'The Roman government settled Alaric''s successors'' Goths in south-western Gaul in return for military service: the origin of the Visigothic kingdom of Toulouse.', causes: [sack-410], lesson: fall-of-the-west, certainty: established}
- {id: theodosian-code-ev, title: 'Theodosian Code published', date: {from: 438}, themes: [legal], weight: 2, summary: 'Theodosius II published a collection of imperial laws since Constantine, valid in both halves of the empire.', figures: [theodosius-ii], places: [constantinople], sources: [cunctos-populos], lesson: roman-law, certainty: established}
- {id: vandals-africa, title: 'Vandals cross to Africa; Carthage falls', date: {from: 429, to: 439}, themes: [military, economic], weight: 3, summary: 'Gaiseric led the Vandals and Alans from Spain to Africa, besieged Hippo as Augustine lay dying, and took Carthage in 439, depriving the western government of its richest tax base and grain supply.', causes: [rhine-crossing], figures: [gaiseric, augustine], places: [carthage, hippo-regius], lesson: fall-of-the-west, certainty: established}
- {id: catalaunian, title: 'Battle of the Catalaunian Plains', date: {from: 451}, themes: [military], weight: 2, summary: 'Aetius, with Visigothic and other allies, checked Attila''s invasion of Gaul.', figures: [aetius, attila], places: [catalaunian-plains], lesson: fall-of-the-west, certainty: established}
- {id: chalcedon-ev, title: 'Council of Chalcedon', date: {from: 451}, themes: [religious], weight: 2, summary: 'The council''s definition of Christ in two natures split eastern Christianity; Miaphysite communities in Egypt and Syria rejected it.', places: [constantinople], lesson: justinian, certainty: established}
- {id: attila-italy, title: 'Attila invades Italy', date: {from: 452}, themes: [military], weight: 1, summary: 'Attila sacked Aquileia and withdrew from Italy, perhaps because of disease and supply problems as much as the embassy of Pope Leo. He died in 453.', causes: [catalaunian], figures: [attila], places: [aquileia], lesson: fall-of-the-west, certainty: interpretation}
- {id: aetius-murdered, title: 'Valentinian III murders Aetius', date: {from: 454, to: 455}, themes: [political], weight: 2, summary: 'Valentinian killed his general in 454 and was himself assassinated by Aetius'' followers in 455, ending the Theodosian dynasty in the West.', causes: [attila-italy], figures: [aetius], places: [rome], lesson: fall-of-the-west, certainty: established}
- {id: vandal-sack-455, title: 'Vandals sack Rome', date: {from: 455}, themes: [military], weight: 2, summary: 'Gaiseric''s fleet sacked Rome for two weeks, carrying off treasure and the imperial women.', causes: [aetius-murdered, vandals-africa], figures: [gaiseric], places: [rome], lesson: fall-of-the-west, certainty: established}
- {id: expedition-468, title: 'Failed expedition against the Vandals', date: {from: 468}, themes: [military, economic], weight: 2, summary: 'A huge joint eastern and western fleet was destroyed off Cape Bon. The last realistic chance of restoring the West''s revenues was lost.', causes: [vandal-sack-455], figures: [gaiseric, ricimer], places: [carthage], lesson: fall-of-the-west, certainty: established}
- {id: deposition-476, title: 'Odoacer deposes Romulus Augustulus', date: {from: 476, label: 'September 476'}, themes: [political], weight: 3, summary: 'The general Odoacer deposed the boy emperor and sent the regalia to Constantinople. Contemporaries barely noticed; the date became a turning point only in later historiography.', causes: [expedition-468], figures: [odoacer, romulus-augustulus], places: [ravenna], sources: [marcellinus-476], lesson: fall-of-the-west, certainty: established}
- {id: theoderic-italy, title: 'Theoderic takes Italy', date: {from: 489, to: 493}, themes: [military, political], weight: 2, summary: 'Sent by the emperor Zeno, the Ostrogothic king defeated Odoacer and ruled Italy through Roman institutions until 526.', causes: [deposition-476], figures: [theoderic, odoacer], places: [ravenna], lesson: fall-of-the-west, certainty: established}
- {id: corpus-iuris-ev, title: 'Justinian''s codification of law', date: {from: 529, to: 534}, themes: [legal], weight: 3, summary: 'Tribonian''s commissions produced the Codex, Digest and Institutes: the "body of civil law" that later shaped European legal systems.', figures: [justinian, tribonian], places: [constantinople], sources: [justinian-institutes], lesson: justinian, certainty: established}
- {id: nika-riot, title: 'Nika riot', date: {from: 532, label: 'January 532'}, themes: [political, social], weight: 3, summary: 'The Blue and Green circus factions united against the government, burned much of the city and proclaimed a rival emperor. Justinian stayed, Procopius says on Theodora''s urging, and soldiers massacred thousands in the Hippodrome.', figures: [justinian, theodora, belisarius, procopius], places: [constantinople], sources: [procopius-nika], lesson: justinian, certainty: established}
- {id: hagia-sophia, title: 'Hagia Sophia rebuilt', date: {from: 532, to: 537}, themes: [religious, cultural], weight: 3, summary: 'Anthemius of Tralles and Isidore of Miletus raised the great domed church in under six years on the site burnt in the riot.', causes: [nika-riot], figures: [justinian], places: [constantinople], sources: [procopius-buildings], lesson: justinian, certainty: established}
- {id: vandal-war, title: 'Reconquest of Africa', date: {from: 533, to: 534}, themes: [military], weight: 2, summary: 'Belisarius destroyed the Vandal kingdom in a few months; resistance by Berber groups and mutinies made Africa costly for years.', causes: [nika-riot], figures: [belisarius, justinian, procopius], places: [carthage], lesson: justinian, certainty: established}
- {id: gothic-war, title: 'Gothic War in Italy', date: {from: 535, to: 554}, themes: [military], weight: 3, summary: 'Two decades of war destroyed the Ostrogothic kingdom and devastated Italy; the Lombard invasion of 568 undid much of the reconquest.', causes: [vandal-war], figures: [belisarius, justinian], places: [ravenna, rome], lesson: justinian, certainty: established}
- {id: dust-veil-536, title: 'Volcanic dust veil and cold decade', date: {from: 536, to: 545}, themes: [social, economic], weight: 2, summary: 'Eruptions in 536 and 540 dimmed the sun; tree rings record sharp cooling, the start of what some call a Late Antique Little Ice Age.', lesson: environment-disease, certainty: established}
- {id: justinianic-plague, title: 'Justinianic Plague', date: {from: 541, to: 544, label: 'from 541, recurring to c. 750'}, themes: [social, economic], weight: 3, summary: 'Bubonic plague, confirmed by ancient DNA as Yersinia pestis, reached Constantinople in 542. Its demographic impact is debated between catastrophe and resilience.', causes: [dust-veil-536], figures: [justinian, procopius], places: [constantinople, alexandria], lesson: justinian, certainty: contested}
- {id: dome-collapse, title: 'Collapse and rebuilding of Hagia Sophia''s dome', date: {from: 558, to: 562}, themes: [cultural], weight: 1, summary: 'Earthquakes brought down the first dome, which was rebuilt higher.', causes: [hagia-sophia], places: [constantinople], lesson: justinian, certainty: established}
- {id: lombards, title: 'Lombards invade Italy', date: {from: 568}, themes: [military], weight: 2, summary: 'Within years much of the peninsula was lost; Rome and Ravenna remained in imperial hands.', causes: [gothic-war], places: [ravenna], lesson: justinian, certainty: established}
- {id: persian-war-602, title: 'Last great Roman-Persian war', date: {from: 602, to: 628}, themes: [military], weight: 3, summary: 'After Phocas murdered the emperor Maurice, Khosrow II invaded. Persia took Syria, Jerusalem and Egypt, and with the Avars besieged Constantinople, before Heraclius'' counter-offensive.', figures: [khosrow-ii, heraclius], places: [jerusalem, alexandria, constantinople], lesson: heraclius-islam, certainty: established}
- {id: siege-626, title: 'Avar-Persian siege of Constantinople', date: {from: 626}, themes: [military, religious], weight: 2, summary: 'The city held behind its walls and navy while Heraclius campaigned in the Caucasus; the defenders credited the Virgin Mary.', causes: [persian-war-602], figures: [heraclius], places: [constantinople], lesson: heraclius-islam, certainty: established}
- {id: nineveh-627, title: 'Battle of Nineveh', date: {from: 627}, themes: [military], weight: 2, summary: 'Heraclius defeated the Persian army in Mesopotamia; Khosrow II was overthrown and peace restored the old frontier.', causes: [siege-626], figures: [heraclius, khosrow-ii], places: [ctesiphon], lesson: heraclius-islam, certainty: established}
- {id: yarmuk, title: 'Battle of the Yarmuk', date: {from: 636}, themes: [military], weight: 3, summary: 'Arab armies defeated a large Roman force east of the Sea of Galilee; Syria and Palestine were lost within a few years.', causes: [nineveh-627], figures: [heraclius], places: [yarmuk], lesson: heraclius-islam, certainty: established}
- {id: egypt-lost, title: 'Loss of Egypt', date: {from: 641, to: 642}, themes: [military, economic], weight: 3, summary: 'Alexandria surrendered to the Arabs; the empire lost its richest province and the grain supply of Constantinople.', causes: [yarmuk], places: [alexandria], lesson: heraclius-islam, certainty: established}
- {id: siege-670s, title: 'First Arab siege of Constantinople', date: {from: 667, to: 678, label: '667–669 or 674–678', note: 'Traditionally 674–678; Jankowiak argues the main siege was in 667–669.'}, themes: [military], weight: 2, summary: 'Umayyad forces besieged the city. Later Byzantine tradition credited "Greek fire" with the victory.', causes: [egypt-lost], places: [constantinople], lesson: heraclius-islam, certainty: contested}
- {id: siege-717, title: 'Great Arab siege of Constantinople', date: {from: 717, to: 718}, themes: [military], weight: 3, summary: 'Leo III defended the city against a massive Umayyad army and fleet. Its failure marked the limit of Arab expansion against the empire.', causes: [siege-670s], places: [constantinople], lesson: heraclius-islam, certainty: established}
- {id: iconoclasm-ev, title: 'Iconoclasm', date: {from: 730, to: 843, circa: true}, themes: [religious, political], weight: 2, summary: 'Emperors opposed the veneration of icons in two phases; the restoration of images in 843 is still celebrated in the Orthodox Church.', causes: [siege-717], places: [constantinople], lesson: middle-byzantium, certainty: interpretation}
- {id: bulgaria-annexed, title: 'Basil II annexes Bulgaria', date: {from: 1014, to: 1018}, themes: [military], weight: 2, summary: 'After decades of war Basil II ended the Bulgarian state, leaving the empire at its largest since the seventh century.', figures: [basil-ii], places: [constantinople], lesson: middle-byzantium, certainty: established}
- {id: schism-1054, title: 'Mutual excommunications of 1054', date: {from: 1054}, themes: [religious], weight: 1, summary: 'Papal legates and the patriarch of Constantinople excommunicated each other. Later remembered as the "Great Schism", it was one episode in a long drifting apart.', causes: [iconoclasm-ev], places: [constantinople], lesson: middle-byzantium, certainty: interpretation}
- {id: manzikert, title: 'Battle of Manzikert', date: {from: 1071}, themes: [military], weight: 3, summary: 'The Seljuk sultan Alp Arslan defeated and captured Romanos IV. The defeat mattered less than the civil wars that followed, which opened Anatolia to Turkish settlement.', causes: [bulgaria-annexed], places: [manzikert], lesson: middle-byzantium, certainty: interpretation}
- {id: alexios-accession, title: 'Alexios I Komnenos seizes power', date: {from: 1081}, themes: [political], weight: 2, summary: 'A military aristocrat took the throne and rebuilt the state around his family.', causes: [manzikert], figures: [alexios-i], places: [constantinople], lesson: middle-byzantium, certainty: established}
- {id: first-crusade, title: 'First Crusade', date: {from: 1096, to: 1099}, themes: [military, religious], weight: 2, summary: 'Alexios'' request for western mercenaries helped trigger a mass armed pilgrimage. The crusaders took Nicaea for him but kept Antioch and Jerusalem for themselves.', causes: [alexios-accession], figures: [alexios-i, anna-komnene], places: [nicaea, antioch, jerusalem], lesson: middle-byzantium, certainty: established}
- {id: sack-1204, title: 'Fourth Crusade sacks Constantinople', date: {from: 1204, label: 'April 1204'}, themes: [military, religious], weight: 3, summary: 'A crusade bound for Egypt was diverted to restore a Byzantine pretender, then stormed and sacked the city. A Latin Empire was set up; Byzantine successor states formed at Nicaea, Trebizond and in Epirus.', causes: [first-crusade, schism-1054], figures: [enrico-dandolo], places: [constantinople, trebizond, nicaea], sources: [choniates-1204], lesson: middle-byzantium, certainty: established}
- {id: recovery-1261, title: 'Recovery of Constantinople', date: {from: 1261}, themes: [military, political], weight: 2, summary: 'A Nicaean force entered the city almost unopposed; Michael VIII restored the Roman empire in its old capital.', causes: [sack-1204], figures: [michael-viii], places: [constantinople, nicaea], lesson: fall-of-constantinople, certainty: established}
- {id: ottomans-europe, title: 'Ottomans cross into Europe', date: {from: 1354}, themes: [military], weight: 2, summary: 'Ottoman forces occupied Gallipoli after an earthquake, beginning their expansion in the Balkans; by the 1370s the emperors were Ottoman vassals.', causes: [recovery-1261], places: [constantinople], lesson: fall-of-constantinople, certainty: established}
- {id: union-florence, title: 'Union of the Churches at Florence', date: {from: 1439}, themes: [religious, political], weight: 1, summary: 'John VIII accepted union with Rome in hope of western military help; it was bitterly opposed in Constantinople and brought little aid.', causes: [ottomans-europe, schism-1054], places: [constantinople], lesson: fall-of-constantinople, certainty: established}
- {id: fall-1453, title: 'Fall of Constantinople', date: {from: 1453, label: '29 May 1453'}, themes: [military, political], weight: 3, summary: 'After a siege of almost two months Mehmed II''s army stormed the city; Constantine XI died in the fighting. The Roman empire ended, though the Ottoman sultans claimed its inheritance.', causes: [union-florence, ottomans-europe], figures: [constantine-xi, mehmed-ii], places: [constantinople], sources: [kritoboulos-1453], lesson: fall-of-constantinople, certainty: established}
