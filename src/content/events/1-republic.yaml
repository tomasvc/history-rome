- {id: early-settlement, title: 'Earliest settlement on the Palatine', date: {from: -900, to: -800, circa: true, label: 'c. 10th–9th c. BC', note: 'Archaeological dating; ceramic chronologies are still debated.'}, themes: [social], weight: 2, summary: 'Hut foundations and burials show villages on the Palatine and other hills from the late Bronze and early Iron Age, long before the traditional foundation date.', places: [rome], lesson: origins, certainty: established}
- {id: foundation-rome, title: 'Traditional foundation of Rome', date: {from: -753, label: '753 BC (traditional)', note: 'Varro''s calculation; other ancient dates ranged from 814 to 729 BC.'}, themes: [political, religious], weight: 3, summary: 'The date later Romans assigned to Romulus'' foundation. It is an antiquarian construction; the city emerged gradually from a cluster of hilltop villages.', causes: [early-settlement], figures: [romulus], places: [rome], sources: [livy-preface], lesson: origins, certainty: contested}
- {id: forum-paved, title: 'First paving of the Forum valley', date: {from: -650, circa: true, label: 'c. 650–600 BC'}, themes: [social, political], weight: 1, summary: 'Drainage and paving of the low ground between the hills created a public space; archaeologists treat this as a sign of a unified community, an early city.', places: [rome], lesson: origins, certainty: interpretation}
- {id: capitoline-temple, title: 'Temple of Jupiter on the Capitol', date: {from: -509, circa: true, note: 'Dedication traditionally dated to the first year of the Republic.'}, themes: [religious, political], weight: 2, summary: 'The huge temple of Jupiter Optimus Maximus, Juno and Minerva, Etruscan in style, shows the resources of late regal Rome. It became the centre of Roman state religion and the end point of every triumph.', places: [rome], lesson: origins, certainty: established}
- {id: expulsion-kings, title: 'Expulsion of the kings; the Republic begins', date: {from: -509, label: '509 BC (traditional)'}, themes: [political], weight: 3, summary: 'Tradition says that after the rape of Lucretia the Tarquins were expelled and two annual consuls replaced the king. The date and the story are stylised, but an end of kingship around 500 BC is widely accepted.', causes: [capitoline-temple], figures: [tarquinius-superbus], places: [rome], sources: [livy-preface], lesson: origins, certainty: contested}
- {id: first-secession, title: 'First secession of the plebs', date: {from: -494, label: '494 BC (traditional)'}, themes: [political, social], weight: 2, summary: 'Plebeian soldiers withdrew from the city in protest at debt bondage and arbitrary treatment, winning their own officials, the tribunes. The story is told by Livy; the institution of the tribunate is real.', causes: [expulsion-kings], places: [rome], lesson: early-republic, certainty: contested}
- {id: twelve-tables-ev, title: 'The Twelve Tables', date: {from: -451, to: -450, label: '451–450 BC (traditional)'}, themes: [legal, social], weight: 3, summary: 'A board of ten men (decemviri) drew up Rome''s first written laws, displayed in the Forum. Fragments quoted by later writers show a society of farmers, debtors, patrons and households.', causes: [first-secession], places: [rome], sources: [twelve-tables], lesson: early-republic, certainty: interpretation}
- {id: veii-falls, title: 'Fall of Veii', date: {from: -396, label: '396 BC (traditional)'}, themes: [military], weight: 2, summary: 'Rome captured its powerful Etruscan neighbour after a long war, doubling its territory and introducing pay for soldiers.', places: [veii], lesson: early-republic, certainty: interpretation}
- {id: gallic-sack, title: 'Sack of Rome by the Gauls', date: {from: -390, label: '390 BC (Varro) / 387 BC (Polybius)', note: 'Roman and Greek chronologies differ; no clear destruction layer has been found.'}, themes: [military], weight: 3, summary: 'A Gallic war band defeated the Romans at the Allia and occupied the city. The trauma loomed large in Roman memory, and Livy claimed most early records were lost in the fire.', causes: [veii-falls], places: [rome], sources: [livy-preface], lesson: early-republic, certainty: contested}
- {id: licinio-sextian, title: 'Licinio-Sextian laws', date: {from: -367, label: '367 BC (traditional)'}, themes: [political, social], weight: 3, summary: 'Laws attributed to the tribunes Licinius and Sextius opened the consulship to plebeians, limited holdings of public land and eased debt. Their exact content is debated, but plebeian consuls appear regularly from this period.', causes: [first-secession, twelve-tables-ev], places: [rome], lesson: early-republic, certainty: interpretation}
- {id: latin-settlement, title: 'Settlement of the Latin War', date: {from: -338}, themes: [political, military], weight: 3, summary: 'After defeating the Latin League, Rome dissolved it and dealt with each community separately: some received full citizenship, some citizenship without the vote, others remained allies. This flexible system became the model for Roman Italy.', causes: [veii-falls], places: [rome, capua], lesson: early-republic, certainty: established}
- {id: samnite-wars, title: 'Samnite Wars', date: {from: -343, to: -290}, themes: [military], weight: 2, summary: 'Three wars against the Samnite confederation of the central Apennines, including the humiliation of the Caudine Forks (321) and the decisive victory at Sentinum (295), gave Rome control of central Italy.', causes: [veii-falls], lesson: early-republic, certainty: interpretation}
- {id: via-appia, title: 'Via Appia and Aqua Appia begun', date: {from: -312}, themes: [economic, military], weight: 2, summary: 'The censor Appius Claudius began the first great Roman road, from Rome to Capua, and the first aqueduct.', causes: [samnite-wars], figures: [appius-claudius-caecus], places: [rome, capua], lesson: early-republic, certainty: established}
- {id: lex-hortensia, title: 'Lex Hortensia', date: {from: -287}, themes: [political, legal], weight: 3, summary: 'After a final secession, a law made resolutions of the plebeian assembly binding on all citizens. Conventionally the end of the Conflict of the Orders.', causes: [licinio-sextian], places: [rome], lesson: early-republic, certainty: established}
- {id: pyrrhic-war, title: 'War with Pyrrhus', date: {from: -280, to: -275}, themes: [military], weight: 2, summary: 'Tarentum called in Pyrrhus of Epirus, whose costly victories could not break Rome''s capacity to raise new armies. By 270 BC Rome controlled peninsular Italy.', causes: [samnite-wars], figures: [pyrrhus, appius-claudius-caecus], places: [tarentum, heraclea], lesson: early-republic, certainty: established}
- {id: first-punic-war, title: 'First Punic War', date: {from: -264, to: -241}, themes: [military], weight: 3, summary: 'A dispute over Messana in Sicily drew Rome and Carthage into a 23-year war. Rome built fleets from scratch, suffered enormous losses at sea, and finally won at the Aegates Islands. Carthage ceded Sicily and paid an indemnity.', causes: [pyrrhic-war], figures: [hamilcar-barca], places: [messana, syracuse, carthage], sources: [polybius-manpower], lesson: punic-wars, certainty: established}
- {id: mylae, title: 'Battle of Mylae', date: {from: -260}, themes: [military], weight: 1, summary: 'Rome''s first great naval victory, won with boarding bridges (the corvus) that turned sea battles into infantry fights.', causes: [first-punic-war], places: [mylae], lesson: punic-wars, certainty: established}
- {id: aegates, title: 'Battle of the Aegates Islands', date: {from: -241}, themes: [military], weight: 2, summary: 'A Roman fleet financed by private loans from wealthy citizens destroyed the Carthaginian relief fleet, ending the First Punic War.', causes: [first-punic-war], places: [aegates], lesson: punic-wars, certainty: established}
- {id: sicily-province, title: 'Sicily becomes Rome''s first province', date: {from: -241, to: -227, label: '241 BC (control); 227 BC (praetors)'}, themes: [political, economic], weight: 2, summary: 'Western Sicily, and from 227 BC Sardinia-Corsica, were placed under annually elected praetors: the beginning of provincial government and of tribute in grain.', causes: [aegates], places: [syracuse], lesson: price-of-empire, certainty: established}
- {id: sardinia-seized, title: 'Rome seizes Sardinia', date: {from: -238}, themes: [political, military], weight: 1, summary: 'While Carthage fought its mercenary revolt, Rome forced it to cede Sardinia and pay more. Polybius regarded this as unjust and a cause of Carthaginian resentment.', causes: [aegates], places: [carthage], lesson: punic-wars, certainty: established}
- {id: second-punic-war, title: 'Second Punic War', date: {from: -218, to: -201}, themes: [military], weight: 3, summary: 'Hannibal invaded Italy from Spain, won crushing victories, but failed to break Rome''s alliance system. Rome fought on in Spain, Sicily and Greece and finally carried the war to Africa.', causes: [sardinia-seized, sicily-province], figures: [hannibal, fabius-maximus, scipio-africanus], places: [saguntum, new-carthage], sources: [polybius-manpower], lesson: punic-wars, certainty: established}
- {id: trebia, title: 'Battle of the Trebia', date: {from: -218, label: 'December 218 BC'}, themes: [military], weight: 1, summary: 'Hannibal''s first major victory in Italy, after crossing the Alps, won by an ambush in winter.', causes: [second-punic-war], figures: [hannibal], places: [trebia], lesson: punic-wars, certainty: established}
- {id: trasimene, title: 'Battle of Lake Trasimene', date: {from: -217}, themes: [military], weight: 2, summary: 'A consular army was ambushed and destroyed on the shore of the lake. Rome appointed Fabius Maximus dictator.', causes: [trebia], figures: [hannibal, fabius-maximus], places: [trasimene], lesson: punic-wars, certainty: established}
- {id: cannae, title: 'Battle of Cannae', date: {from: -216, label: '2 August 216 BC'}, themes: [military], weight: 3, summary: 'Hannibal enveloped and destroyed the largest army Rome had ever fielded. Ancient figures for Roman dead range from about 48,000 to 70,000. Yet Rome refused to negotiate.', causes: [trasimene], figures: [hannibal], places: [cannae], sources: [polybius-manpower], lesson: punic-wars, certainty: established}
- {id: capua-defects, title: 'Capua and southern allies defect', date: {from: -216, to: -215}, themes: [political], weight: 2, summary: 'Capua, Rome''s second city, and many communities in the south went over to Hannibal; central Italy and the Latin colonies stayed loyal. Rome recaptured Capua in 211 and punished it severely.', causes: [cannae], places: [capua], lesson: punic-wars, certainty: established}
- {id: new-carthage, title: 'Scipio captures New Carthage', date: {from: -209}, themes: [military], weight: 2, summary: 'A daring assault took the Carthaginian base in Spain with its treasury and hostages, turning the Spanish war.', causes: [second-punic-war], figures: [scipio-africanus], places: [new-carthage], lesson: punic-wars, certainty: established}
- {id: metaurus, title: 'Battle of the Metaurus', date: {from: -207}, themes: [military], weight: 1, summary: 'Hannibal''s brother Hasdrubal, bringing reinforcements from Spain, was defeated and killed in northern Italy.', causes: [new-carthage], places: [metaurus], lesson: punic-wars, certainty: established}
- {id: zama, title: 'Battle of Zama', date: {from: -202}, themes: [military], weight: 3, summary: 'Scipio defeated Hannibal in Africa. The peace of 201 stripped Carthage of its fleet and overseas territory and forbade it to make war without Roman permission.', causes: [metaurus, new-carthage], figures: [scipio-africanus, hannibal], places: [zama], lesson: punic-wars, certainty: established}
- {id: hispania-provinces, title: 'Two Spanish provinces created', date: {from: -197}, themes: [political, military], weight: 2, summary: 'Rome kept the former Carthaginian territories in Spain and created two provinces, which required permanent armies and sixty years of brutal warfare.', causes: [zama], places: [tarraco, new-carthage], lesson: price-of-empire, certainty: established}
- {id: cynoscephalae, title: 'Battle of Cynoscephalae', date: {from: -197}, themes: [military], weight: 2, summary: 'Flamininus defeated Philip V of Macedon; at the Isthmian Games of 196 he proclaimed the "freedom of the Greeks", on Roman terms.', causes: [zama], places: [cynoscephalae], lesson: price-of-empire, certainty: established}
- {id: magnesia, title: 'Battle of Magnesia', date: {from: -190, label: '190/189 BC'}, themes: [military], weight: 1, summary: 'The Scipio brothers defeated the Seleucid king Antiochus III; the Peace of Apamea (188) excluded him from Asia Minor.', causes: [cynoscephalae], places: [magnesia], lesson: price-of-empire, certainty: established}
- {id: bacchanalia, title: 'Senate''s decree on the Bacchanals', date: {from: -186}, themes: [religious, political], weight: 2, summary: 'The Senate suppressed the worship of Bacchus across Italy, including among allies, on the grounds of conspiracy. A bronze copy of the decree survives.', places: [rome], sources: [sc-bacchanalibus], lesson: price-of-empire, certainty: established}
- {id: lex-villia, title: 'Lex Villia annalis', date: {from: -180}, themes: [political, legal], weight: 1, summary: 'Set minimum ages and intervals for magistracies, formalising the cursus honorum as competition for office intensified.', lesson: republican-constitution, certainty: established}
- {id: pydna, title: 'Battle of Pydna', date: {from: -168}, themes: [military], weight: 2, summary: 'Aemilius Paullus destroyed the Macedonian monarchy. So much booty flowed to Rome that citizens in Italy ceased to pay direct tax (tributum) from 167 BC.', causes: [magnesia], places: [pydna], lesson: price-of-empire, certainty: established}
- {id: lex-calpurnia, title: 'First standing court for extortion', date: {from: -149}, themes: [legal, political], weight: 2, summary: 'The lex Calpurnia created a permanent court to hear complaints of extortion by governors, an admission that provincial rule was enriching Roman officials.', causes: [hispania-provinces], places: [rome], lesson: price-of-empire, certainty: established}
- {id: third-punic-war, title: 'Third Punic War', date: {from: -149, to: -146}, themes: [military], weight: 2, summary: 'Rome used a Carthaginian war with Numidia as pretext, demanded that the Carthaginians abandon their city, and besieged it when they refused.', causes: [zama], figures: [cato-elder, scipio-aemilianus], places: [carthage], lesson: punic-wars, certainty: established}
- {id: carthage-destroyed, title: 'Destruction of Carthage', date: {from: -146}, themes: [military, political], weight: 3, summary: 'Scipio Aemilianus took and razed Carthage; its territory became the province of Africa. The same year Corinth was sacked. Later writers dated Rome''s moral decline from the removal of its great rival.', causes: [third-punic-war], figures: [scipio-aemilianus, polybius], places: [carthage, corinth], lesson: punic-wars, certainty: established}
- {id: numantia, title: 'Fall of Numantia', date: {from: -133}, themes: [military], weight: 1, summary: 'After two decades of resistance, the Celtiberian town fell to Scipio Aemilianus after a siege.', causes: [hispania-provinces], figures: [scipio-aemilianus], places: [numantia], lesson: price-of-empire, certainty: established}
- {id: attalus-bequest, title: 'Attalus III bequeaths Pergamum to Rome', date: {from: -133}, themes: [political, economic], weight: 2, summary: 'The last king of Pergamum left his kingdom to the Roman people; it became the province of Asia, the richest source of tribute in the empire.', places: [pergamum], lesson: gracchi, certainty: established}
- {id: tiberius-tribunate, title: 'Tribunate and murder of Tiberius Gracchus', date: {from: -133}, themes: [political, social], weight: 3, summary: 'Tiberius passed a land law over a colleague''s veto by having him deposed, proposed to use the Pergamene treasure, and stood for re-election. Senators led by Scipio Nasica killed him and hundreds of supporters.', causes: [attalus-bequest, numantia], figures: [tiberius-gracchus, scipio-aemilianus, cornelia], places: [rome], sources: [gracchus-speech], lesson: gracchi, certainty: established}
- {id: gaius-gracchus-reforms, title: 'Reforms of Gaius Gracchus', date: {from: -123, to: -122}, themes: [political, legal, economic], weight: 2, summary: 'Subsidised grain, colonies, roads, equestrian juries in the extortion court and the Asian tax contracts; a proposal to enfranchise the Latins failed.', causes: [tiberius-tribunate], figures: [gaius-gracchus], places: [rome], lesson: gracchi, certainty: established}
- {id: sc-ultimum-121, title: 'First "final decree" and death of Gaius Gracchus', date: {from: -121}, themes: [political, legal], weight: 3, summary: 'The Senate urged the consul Opimius to defend the state; some 3,000 Gracchans were killed. Political violence was now authorised by the Senate.', causes: [gaius-gracchus-reforms], figures: [gaius-gracchus], places: [rome], lesson: gracchi, certainty: established}
- {id: jugurthine-war, title: 'Jugurthine War', date: {from: -112, to: -105}, themes: [military, political], weight: 2, summary: 'A war in Numidia exposed incompetence and alleged bribery among senatorial commanders and allowed Marius to win the consulship and the command by popular vote.', figures: [jugurtha, marius, sulla], sources: [], lesson: marius-sulla, certainty: established}
- {id: marius-recruits, title: 'Marius enlists volunteers without property', date: {from: -107}, themes: [military, social], weight: 2, summary: 'For the African campaign Marius enrolled volunteers from the capite censi. Long treated as a decisive "reform", it is now often seen as one step in a longer process.', causes: [jugurthine-war], figures: [marius], lesson: marius-sulla, certainty: contested}
- {id: arausio, title: 'Disaster at Arausio', date: {from: -105}, themes: [military], weight: 2, summary: 'Migrating Cimbri and Teutones destroyed two Roman armies on the Rhône, a loss compared to Cannae. Marius was elected consul for five successive years.', places: [arausio], lesson: marius-sulla, certainty: established}
- {id: aquae-sextiae, title: 'Victories at Aquae Sextiae and Vercellae', date: {from: -102, to: -101}, themes: [military], weight: 1, summary: 'Marius destroyed the Teutones and, with Catulus, the Cimbri.', causes: [arausio, marius-recruits], figures: [marius], places: [aquae-sextiae], lesson: marius-sulla, certainty: established}
- {id: social-war, title: 'Social War', date: {from: -91, to: -87}, themes: [military, political], weight: 3, summary: 'After the murder of the tribune Drusus, who had proposed citizenship for the allies, much of Italy rebelled and founded its own state, Italia. Rome won militarily by conceding citizenship to loyal and then to all Italians south of the Po.', causes: [gaius-gracchus-reforms], figures: [sulla, marius], places: [rome], lesson: marius-sulla, certainty: established}
- {id: mithridatic-massacre, title: 'Mithridates'' massacre of Romans in Asia', date: {from: -88}, themes: [military, economic], weight: 2, summary: 'Mithridates VI overran Asia and ordered the killing of Roman and Italian residents, a sign of hatred for Roman tax-farmers and traders.', figures: [mithridates], places: [ephesus, pergamum], lesson: marius-sulla, certainty: established}
- {id: sulla-marches, title: 'Sulla marches on Rome', date: {from: -88}, themes: [political, military], weight: 3, summary: 'When the people transferred his eastern command to Marius, Sulla led his army against the city, the first Roman to do so. His officers, except one, refused to follow; his soldiers did not.', causes: [social-war, mithridatic-massacre, marius-recruits], figures: [sulla, marius], places: [rome], lesson: marius-sulla, certainty: established}
- {id: sulla-dictator, title: 'Sulla''s victory, proscriptions and dictatorship', date: {from: -82, to: -79}, themes: [political, legal], weight: 3, summary: 'Victorious at the Colline Gate, Sulla published lists of enemies to be killed, revived the dictatorship to reform the constitution, strengthened the Senate and curbed the tribunes.', causes: [sulla-marches], figures: [sulla, pompey, crassus], places: [rome], lesson: marius-sulla, certainty: established}
- {id: spartacus-revolt, title: 'Revolt of Spartacus', date: {from: -73, to: -71}, themes: [social, military], weight: 2, summary: 'Escaped gladiators and slaves defeated several Roman armies before Crassus crushed them and crucified 6,000 along the Via Appia.', figures: [spartacus, crassus], places: [capua], lesson: caesar, certainty: established}
- {id: lex-gabinia, title: 'Lex Gabinia: Pompey''s command against the pirates', date: {from: -67}, themes: [political, military], weight: 2, summary: 'A tribune''s law gave Pompey an unprecedented three-year command over the Mediterranean and its coasts. He cleared the seas in months.', causes: [sulla-dictator], figures: [pompey], places: [rome], lesson: caesar, certainty: established}
- {id: pompey-east, title: 'Pompey''s eastern settlement', date: {from: -66, to: -62}, themes: [political, military, economic], weight: 2, summary: 'Commanding against Mithridates by the lex Manilia, Pompey ended the war, annexed Syria, took Jerusalem and reorganised the East, raising Rome''s revenues greatly.', causes: [lex-gabinia], figures: [pompey, mithridates], places: [antioch, jerusalem], lesson: caesar, certainty: established}
- {id: catiline-conspiracy, title: 'Conspiracy of Catiline', date: {from: -63}, themes: [political], weight: 2, summary: 'Cicero as consul exposed Catiline''s plot and had five conspirators executed without trial on the Senate''s authority, a decision that later cost him exile.', figures: [cicero, catiline, cato-younger, caesar], places: [rome], lesson: caesar, certainty: established}
- {id: first-triumvirate, title: 'Alliance of Pompey, Crassus and Caesar', date: {from: -60, to: -59}, themes: [political], weight: 3, summary: 'An informal pact (later called the "First Triumvirate") among three men frustrated by the Senate gave Caesar the consulship and secured Pompey''s eastern settlement and land for his veterans.', causes: [pompey-east], figures: [pompey, crassus, caesar, julia-caesaris], places: [rome], lesson: caesar, certainty: established}
- {id: gallic-war, title: 'Caesar''s conquest of Gaul', date: {from: -58, to: -50}, themes: [military], weight: 3, summary: 'Caesar used his provincial command to conquer all Gaul to the Rhine, invade Britain twice and cross the Rhine, at the cost of hundreds of thousands of Gallic lives by his own reckoning.', causes: [first-triumvirate], figures: [caesar], places: [alesia, lugdunum], lesson: caesar, certainty: established}
- {id: clodius-grain, title: 'Clodius makes the grain dole free', date: {from: -58}, themes: [political, economic], weight: 1, summary: 'As tribune Clodius made monthly grain free for citizens in Rome, restored the collegia and secured Cicero''s exile.', causes: [catiline-conspiracy], figures: [clodius, cicero], places: [rome], lesson: caesar, certainty: established}
- {id: carrhae, title: 'Battle of Carrhae', date: {from: -53}, themes: [military], weight: 2, summary: 'Parthian horse archers and cataphracts destroyed Crassus'' army in Mesopotamia; Crassus was killed and legionary standards captured.', causes: [first-triumvirate], figures: [crassus, cassius], places: [carrhae], lesson: caesar, certainty: established}
- {id: alesia, title: 'Siege of Alesia', date: {from: -52}, themes: [military], weight: 2, summary: 'Caesar besieged Vercingetorix in Alesia, building double lines of fortifications against the town and a relieving army, and forced his surrender.', causes: [gallic-war], figures: [caesar], places: [alesia], lesson: caesar, certainty: established}
- {id: clodius-killed, title: 'Murder of Clodius; Pompey sole consul', date: {from: -52}, themes: [political], weight: 1, summary: 'Clodius'' murder by Milo''s gang and the burning of the Senate house led the Senate to make Pompey sole consul to restore order, drawing him toward Caesar''s opponents.', causes: [clodius-grain, carrhae], figures: [clodius, pompey], places: [rome], lesson: caesar, certainty: established}
- {id: rubicon, title: 'Caesar crosses the Rubicon', date: {from: -49, label: 'January 49 BC'}, themes: [political, military], weight: 3, summary: 'Ordered to give up his army without the guarantee of a second consulship, Caesar led a legion across the river that marked the border of Italy, beginning civil war.', causes: [clodius-killed, gallic-war], figures: [caesar, pompey, cicero], places: [rubicon], sources: [cicero-attic-49], lesson: caesar, certainty: established}
- {id: pharsalus, title: 'Battle of Pharsalus', date: {from: -48, label: 'August 48 BC'}, themes: [military], weight: 3, summary: 'Caesar defeated Pompey in Thessaly. Pompey fled to Egypt and was murdered on landing.', causes: [rubicon], figures: [caesar, pompey], places: [pharsalus], lesson: caesar, certainty: established}
- {id: thapsus-munda, title: 'Thapsus and Munda', date: {from: -46, to: -45}, themes: [military], weight: 1, summary: 'Caesar defeated the Pompeians in Africa (Cato killed himself at Utica) and Spain.', causes: [pharsalus], figures: [caesar, cato-younger], places: [utica], lesson: caesar, certainty: established}
- {id: julian-calendar, title: 'Julian calendar introduced', date: {from: -46, to: -45}, themes: [cultural, religious], weight: 1, summary: 'Caesar replaced the lunar Republican calendar with a solar year of 365¼ days, the basis of the modern calendar.', figures: [caesar], places: [rome], lesson: caesar, certainty: established}
- {id: ides-of-march, title: 'Assassination of Caesar', date: {from: -44, label: '15 March 44 BC'}, themes: [political], weight: 3, summary: 'A month after being named dictator for life, Caesar was stabbed to death by about sixty senators led by Brutus and Cassius at a Senate meeting in the Curia of Pompey.', causes: [thapsus-munda], figures: [caesar, brutus, cassius, mark-antony], places: [rome], sources: [eid-mar], lesson: caesar, certainty: established}
- {id: second-triumvirate, title: 'Second Triumvirate and proscriptions', date: {from: -43}, themes: [political], weight: 3, summary: 'Antony, Octavian and Lepidus were legally appointed "triumvirs for restoring the state" for five years and proscribed hundreds of senators and equites, including Cicero.', causes: [ides-of-march], figures: [mark-antony, augustus, lepidus, cicero], places: [rome], lesson: augustus-power, certainty: established}
- {id: philippi, title: 'Battles of Philippi', date: {from: -42}, themes: [military], weight: 2, summary: 'Antony and Octavian defeated Brutus and Cassius in Macedonia; both assassins killed themselves.', causes: [second-triumvirate], figures: [mark-antony, augustus, brutus, cassius], places: [philippi], lesson: augustus-power, certainty: established}
- {id: perusine-war, title: 'Perusine War', date: {from: -41, to: -40}, themes: [military, social], weight: 1, summary: 'Land confiscations for veterans in Italy provoked resistance led by Lucius Antonius and Fulvia, ending in the siege of Perusia.', causes: [philippi], figures: [fulvia, augustus], lesson: augustus-power, certainty: established}
- {id: actium, title: 'Battle of Actium', date: {from: -31, label: '2 September 31 BC'}, themes: [military, political], weight: 3, summary: 'Agrippa''s fleet defeated Antony and Cleopatra off western Greece. Augustan poets made it a clash of Roman and Egyptian gods; militarily it was decided by blockade and desertion.', causes: [perusine-war], figures: [augustus, agrippa, mark-antony, cleopatra], places: [actium], lesson: augustus-power, certainty: established}
- {id: egypt-annexed, title: 'Annexation of Egypt', date: {from: -30}, themes: [political, economic], weight: 2, summary: 'Antony and Cleopatra killed themselves at Alexandria; Egypt became a province governed by an equestrian prefect answerable to the emperor, and its grain fed Rome.', causes: [actium], figures: [augustus, cleopatra, mark-antony], places: [alexandria], sources: [aegypto-capta], lesson: augustus-power, certainty: established}
