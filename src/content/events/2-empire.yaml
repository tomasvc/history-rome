- {id: settlement-27, title: 'First settlement: "Augustus"', date: {from: -27, label: 'January 27 BC'}, themes: [political], weight: 3, summary: 'Octavian "returned" the state to the Senate and People and was voted the name Augustus and a ten-year command over Spain, Gaul and Syria, which held most of the legions.', causes: [egypt-annexed], figures: [augustus], places: [rome], sources: [res-gestae, tacitus-annals-1], lesson: augustus-power, certainty: established}
- {id: settlement-23, title: 'Second settlement: tribunician power', date: {from: -23}, themes: [political, legal], weight: 2, summary: 'After a serious illness and possibly a conspiracy, Augustus gave up the annual consulship and received tribunician power for life and imperium superior to other governors''.', causes: [settlement-27], figures: [augustus], places: [rome], lesson: augustus-power, certainty: established}
- {id: moral-laws, title: 'Augustan laws on marriage and adultery', date: {from: -18, to: 9, label: '18 BC and AD 9'}, themes: [legal, social], weight: 2, summary: 'Laws penalised the unmarried and childless among the elite and made adultery a public crime. They were resented and widely evaded.', figures: [augustus], places: [rome], lesson: augustan-rome, certainty: established}
- {id: ara-pacis, title: 'Altar of Augustan Peace', date: {from: -13, to: -9}, themes: [cultural, religious], weight: 2, summary: 'Voted on Augustus'' return from Spain and Gaul and dedicated in 9 BC, its reliefs show the imperial family in procession and images of fertility and peace.', figures: [augustus, livia, agrippa], places: [rome], lesson: augustan-rome, certainty: established}
- {id: gaius-lucius-deaths, title: 'Deaths of Gaius and Lucius Caesar', date: {from: 2, to: 4, label: 'AD 2 and AD 4'}, themes: [political], weight: 2, summary: 'Augustus'' adopted grandsons and heirs died young. In AD 4 he adopted Tiberius, who had to adopt Germanicus.', figures: [augustus, tiberius, germanicus], lesson: augustan-rome, certainty: established}
- {id: aerarium-militare-ev, title: 'Military treasury created', date: {from: 6}, themes: [military, economic], weight: 2, summary: 'A fund financed by new taxes on inheritances and sales paid soldiers'' discharge bonuses, tying the army''s rewards to the state and its ruler rather than to individual generals.', figures: [augustus], places: [rome], lesson: augustan-rome, certainty: established}
- {id: teutoburg, title: 'Defeat of Varus in the Teutoburg Forest', date: {from: 9}, themes: [military], weight: 3, summary: 'Arminius, a Cheruscan officer in Roman service, ambushed and destroyed three legions under Varus. Rome abandoned the attempt to make Germany between Rhine and Elbe a province.', figures: [augustus], places: [teutoburg], lesson: augustan-rome, certainty: established}
- {id: death-augustus, title: 'Death of Augustus; Tiberius succeeds', date: {from: 14, label: '19 August AD 14'}, themes: [political], weight: 3, summary: 'Augustus died at Nola. The Senate deified him; Tiberius, already holding imperium and tribunician power, accepted the position after an awkward debate.', causes: [gaius-lucius-deaths], figures: [augustus, tiberius, livia], places: [rome], sources: [res-gestae], lesson: julio-claudians, certainty: established}
- {id: germanicus-death, title: 'Death of Germanicus at Antioch', date: {from: 19}, themes: [political], weight: 1, summary: 'The popular heir died after a quarrel with the governor Piso. The Senate''s decree on Piso''s trial survives on bronze.', causes: [death-augustus], figures: [germanicus, tiberius, agrippina-elder], places: [antioch], lesson: julio-claudians, certainty: established}
- {id: sejanus-fall, title: 'Fall of Sejanus', date: {from: 31}, themes: [political], weight: 2, summary: 'Tiberius'' all-powerful praetorian prefect was denounced in a letter from Capri and executed; treason trials followed.', figures: [sejanus, tiberius], places: [rome, capri], lesson: julio-claudians, certainty: established}
- {id: caligula-murdered, title: 'Murder of Caligula; Claudius made emperor', date: {from: 41}, themes: [political], weight: 2, summary: 'Officers of the Guard killed Caligula. While the Senate debated restoring the Republic, the praetorians proclaimed Claudius, a decisive demonstration of who made emperors.', figures: [caligula, claudius], places: [rome], lesson: julio-claudians, certainty: established}
- {id: britain-invasion, title: 'Invasion of Britain', date: {from: 43}, themes: [military], weight: 2, summary: 'Claudius sent four legions to Britain and arrived for the capture of Camulodunum, gaining the military glory his position needed.', figures: [claudius], places: [camulodunum, londinium], lesson: julio-claudians, certainty: established}
- {id: gauls-senate, title: 'Claudius admits Gallic notables to the Senate', date: {from: 48}, themes: [political], weight: 2, summary: 'As censor, Claudius argued that Rome had always grown by absorbing outsiders. His speech survives on a bronze tablet from Lugdunum and in Tacitus'' rewritten version.', figures: [claudius, tacitus], places: [lugdunum], sources: [claudius-gauls], lesson: julio-claudians, certainty: established}
- {id: boudican-revolt, title: 'Revolt of Boudica', date: {from: 60, to: 61, label: 'AD 60 or 61'}, themes: [military, social], weight: 2, summary: 'The Iceni and Trinovantes destroyed Camulodunum, Londinium and Verulamium before defeat by Suetonius Paulinus.', causes: [britain-invasion], figures: [boudica], places: [camulodunum, londinium], lesson: romanisation, certainty: established}
- {id: great-fire, title: 'Great Fire of Rome', date: {from: 64, label: 'July AD 64'}, themes: [political, religious], weight: 3, summary: 'Fire destroyed much of Rome. Nero blamed the Christians, many of whom were executed, and built his Golden House on burnt land.', figures: [nero], places: [rome], lesson: julio-claudians, certainty: established}
- {id: jewish-war, title: 'Jewish revolt begins', date: {from: 66}, themes: [military, religious], weight: 2, summary: 'Conflict in Caesarea and abuses by the procurator Florus sparked revolt in Judaea; Vespasian was sent to suppress it.', figures: [vespasian, josephus], places: [jerusalem, caesarea-maritima], lesson: year-69-flavians, certainty: established}
- {id: nero-death, title: 'Fall and suicide of Nero', date: {from: 68, label: 'June AD 68'}, themes: [political], weight: 3, summary: 'Revolts by Vindex in Gaul and Galba in Spain, and the desertion of the Guard, led the Senate to declare Nero a public enemy. His suicide ended the Julio-Claudian line.', causes: [great-fire], figures: [nero, galba], places: [rome], lesson: year-69-flavians, certainty: established}
- {id: year-four-emperors, title: 'Year of the Four Emperors', date: {from: 69}, themes: [political, military], weight: 3, summary: 'Galba, Otho, Vitellius and Vespasian were successively recognised as provincial armies fought for the throne. Tacitus: the secret of empire was out, that an emperor could be made elsewhere than at Rome.', causes: [nero-death], figures: [galba, otho, vitellius, vespasian], places: [rome, bedriacum], sources: [tacitus-histories-1-4], lesson: year-69-flavians, certainty: established}
- {id: lex-de-imperio-ev, title: 'Law on the power of Vespasian', date: {from: 69, to: 70, label: 'December AD 69 / early 70'}, themes: [political, legal], weight: 2, summary: 'The Senate and people conferred powers on Vespasian with precedents from Augustus, Tiberius and Claudius. Part of the law survives on a bronze tablet in Rome.', causes: [year-four-emperors], figures: [vespasian], places: [rome], sources: [lex-de-imperio], lesson: year-69-flavians, certainty: established}
- {id: temple-destroyed, title: 'Fall of Jerusalem and destruction of the Temple', date: {from: 70}, themes: [military, religious], weight: 3, summary: 'Titus took Jerusalem after a long siege; the Temple was burned. The Jewish tax was diverted to Jupiter Capitolinus; Masada fell in 73 or 74.', causes: [jewish-war], figures: [titus, josephus], places: [jerusalem, masada], sources: [arch-of-titus], lesson: year-69-flavians, certainty: established}
- {id: vesuvius, title: 'Eruption of Vesuvius', date: {from: 79, label: 'AD 79 (August or October)', note: 'The traditional date of 24 August is challenged by an inscription and finds suggesting October.'}, themes: [social], weight: 2, summary: 'The eruption buried Pompeii, Herculaneum and Stabiae, preserving them for archaeology. Pliny the Younger described it in two letters to Tacitus.', figures: [titus, pliny-younger, tacitus], places: [pompeii, herculaneum, misenum], sources: [pompeii-walls], lesson: daily-life, certainty: established}
- {id: colosseum, title: 'Flavian Amphitheatre inaugurated', date: {from: 80}, themes: [cultural, political], weight: 2, summary: 'Built on the site of Nero''s lake with the spoils of Judaea, the Colosseum gave back to the people space Nero had taken for himself.', causes: [temple-destroyed], figures: [titus, vespasian], places: [rome], lesson: year-69-flavians, certainty: established}
- {id: domitian-killed, title: 'Murder of Domitian; Nerva chosen', date: {from: 96}, themes: [political], weight: 2, summary: 'A palace conspiracy killed Domitian; the Senate chose the elderly Nerva and condemned Domitian''s memory.', figures: [domitian], places: [rome], lesson: year-69-flavians, certainty: established}
- {id: trajan-adopted, title: 'Nerva adopts Trajan', date: {from: 97}, themes: [political], weight: 2, summary: 'Under pressure from a Praetorian mutiny, Nerva adopted the governor of Upper Germany, a respected general with military support.', causes: [domitian-killed], figures: [trajan], lesson: trajan-hadrian, certainty: established}
- {id: dacian-wars, title: 'Trajan''s Dacian Wars', date: {from: 101, to: 106}, themes: [military, economic], weight: 2, summary: 'Two wars destroyed the Dacian kingdom of Decebalus; Dacia became a province, and its gold financed Trajan''s Forum and Column.', causes: [trajan-adopted], figures: [trajan], places: [sarmizegetusa], lesson: trajan-hadrian, certainty: established}
- {id: pliny-bithynia, title: 'Pliny governs Bithynia-Pontus', date: {from: 109, to: 111, circa: true, note: 'Exact years debated (c. 109–113).'}, themes: [political, legal, religious], weight: 2, summary: 'Pliny''s letters to Trajan record his handling of city finances, building projects, associations and the Christians.', figures: [pliny-younger, trajan], places: [nicomedia, nicaea], sources: [pliny-christians, pliny-fire-brigade], lesson: governing-provinces, certainty: established}
- {id: trajan-parthia, title: 'Trajan''s Parthian war', date: {from: 114, to: 117}, themes: [military], weight: 2, summary: 'Trajan annexed Armenia and Mesopotamia and reached the Persian Gulf, but revolts, including a great Jewish diaspora revolt, broke out behind him.', causes: [dacian-wars], figures: [trajan], places: [ctesiphon], lesson: trajan-hadrian, certainty: established}
- {id: hadrian-accession, title: 'Hadrian succeeds and abandons Mesopotamia', date: {from: 117}, themes: [political, military], weight: 2, summary: 'Hadrian, claiming a deathbed adoption, gave up the new eastern provinces and executed four senior senators.', causes: [trajan-parthia], figures: [hadrian, trajan], lesson: trajan-hadrian, certainty: established}
- {id: hadrians-wall-ev, title: 'Hadrian''s Wall begun', date: {from: 122, circa: true}, themes: [military], weight: 2, summary: 'A stone and turf barrier with forts and milecastles was built across northern Britain, controlling movement rather than sealing a border.', causes: [hadrian-accession], figures: [hadrian], places: [hadrians-wall, vindolanda], lesson: army-frontiers, certainty: established}
- {id: bar-kokhba, title: 'Bar Kokhba revolt', date: {from: 132, to: 136}, themes: [military, religious], weight: 2, summary: 'A messianic revolt in Judaea, provoked in part by Hadrian''s plan for a Roman colony at Jerusalem, was crushed with heavy casualties.', causes: [temple-destroyed], figures: [hadrian], places: [jerusalem], lesson: trajan-hadrian, certainty: established}
- {id: antonine-wall-ev, title: 'Antonine Wall built', date: {from: 142, circa: true}, themes: [military], weight: 1, summary: 'Antoninus Pius advanced the British frontier to the Forth–Clyde line; it was abandoned within about twenty years.', causes: [hadrians-wall-ev], figures: [antoninus-pius], places: [antonine-wall], lesson: army-frontiers, certainty: established}
- {id: antonine-plague, title: 'Antonine Plague', date: {from: 165, to: 180, label: 'from c. AD 165'}, themes: [social, economic], weight: 3, summary: 'A pandemic, probably smallpox, spread from the East with the army returning from Verus'' Parthian war. Its mortality is fiercely debated: estimates range from a few per cent to a quarter or more of the population.', figures: [marcus-aurelius, lucius-verus, galen], places: [rome, alexandria], lesson: marcus-aurelius, certainty: contested}
- {id: marcomannic-wars, title: 'Marcomannic Wars', date: {from: 166, to: 180}, themes: [military], weight: 2, summary: 'Germanic and Sarmatian peoples crossed the Danube, reaching Aquileia. Marcus Aurelius spent most of a decade on campaign.', figures: [marcus-aurelius], places: [carnuntum, aquincum, aquileia], lesson: marcus-aurelius, certainty: established}
- {id: commodus-killed, title: 'Murder of Commodus', date: {from: 192, label: '31 December 192'}, themes: [political], weight: 2, summary: 'Courtiers strangled Commodus, opening the civil wars of 193.', figures: [commodus], places: [rome], lesson: marcus-aurelius, certainty: established}
- {id: year-193, title: 'Year of the Five Emperors', date: {from: 193}, themes: [political, military], weight: 2, summary: 'Pertinax was murdered by the Guard, Didius Julianus "bought" the throne, and three provincial governors were proclaimed; Septimius Severus took Rome.', causes: [commodus-killed], figures: [septimius-severus], places: [rome], lesson: severans, certainty: established}
- {id: severan-army, title: 'Severus raises army pay and remodels the Guard', date: {from: 193, to: 211}, themes: [military, economic], weight: 2, summary: 'Severus replaced the Praetorian Guard with legionaries, raised pay, let soldiers marry and stationed a legion near Rome; Caracalla raised pay again.', causes: [year-193], figures: [septimius-severus, caracalla], sources: [dio-severus], lesson: severans, certainty: established}
- {id: constitutio-antoniniana-ev, title: 'Constitutio Antoniniana', date: {from: 212}, themes: [legal, political], weight: 3, summary: 'Caracalla granted Roman citizenship to almost all free inhabitants of the empire. Dio says the aim was to raise inheritance tax; the edict itself speaks of thanks to the gods.', figures: [caracalla], sources: [constitutio-antoniniana], lesson: severans, certainty: established}
- {id: sasanian-rise, title: 'Rise of the Sasanian dynasty', date: {from: 224, to: 226}, themes: [military, political], weight: 3, summary: 'Ardashir overthrew the Parthian Arsacids and founded a more centralised and aggressive Persian empire, Rome''s great rival for four centuries.', places: [ctesiphon], lesson: severans, certainty: established}
- {id: maximinus-acclaimed, title: 'Murder of Severus Alexander; Maximinus acclaimed', date: {from: 235}, themes: [political, military], weight: 3, summary: 'The army on the Rhine killed the last Severan and acclaimed an equestrian officer, opening half a century of short reigns.', causes: [sasanian-rise, severan-army], figures: [severus-alexander, maximinus-thrax], places: [mainz], lesson: third-century-crisis, certainty: established}
- {id: decian-sacrifice, title: 'Decius orders universal sacrifice', date: {from: 249, to: 250}, themes: [religious, political], weight: 2, summary: 'All inhabitants had to sacrifice and obtain certificates; Christians who refused were punished. Dozens of papyrus certificates survive.', figures: [decius, cyprian], lesson: christianisation, certainty: established}
- {id: plague-cyprian, title: 'Plague of Cyprian', date: {from: 249, to: 262, circa: true}, themes: [social], weight: 2, summary: 'A pandemic described by Cyprian of Carthage and others. Its identity and impact are debated; Harper has argued for a major mortality crisis.', figures: [cyprian], places: [carthage, alexandria], lesson: third-century-crisis, certainty: contested}
- {id: abritus, title: 'Battle of Abritus', date: {from: 251}, themes: [military], weight: 2, summary: 'Decius and his son were killed by the Goths in the Dobrudja, the first emperor to die fighting a foreign enemy.', figures: [decius], places: [abritus], lesson: third-century-crisis, certainty: established}
- {id: valerian-captured, title: 'Valerian captured by Shapur I', date: {from: 260}, themes: [military, political], weight: 3, summary: 'The emperor was taken prisoner near Edessa and died in captivity, a humiliation Shapur commemorated in stone.', causes: [sasanian-rise], figures: [valerian, shapur-i], places: [edessa], lesson: third-century-crisis, certainty: established}
- {id: gallic-empire, title: 'The "Gallic Empire"', date: {from: 260, to: 274}, themes: [political, military], weight: 2, summary: 'Postumus, proclaimed on the Rhine, ruled Gaul, Britain and Spain as a Roman emperor focused on local defence.', causes: [valerian-captured], figures: [postumus, gallienus], places: [trier, cologne], lesson: third-century-crisis, certainty: established}
- {id: palmyrene-revolt, title: 'Palmyrene empire of Zenobia', date: {from: 270, to: 272}, themes: [political, military], weight: 2, summary: 'Zenobia of Palmyra took Egypt and much of Asia Minor before Aurelian defeated her and took her city.', causes: [valerian-captured], figures: [zenobia, aurelian], places: [palmyra, alexandria], lesson: third-century-crisis, certainty: established}
- {id: aurelian-walls, title: 'Aurelian Walls begun', date: {from: 271}, themes: [military], weight: 1, summary: 'After an Alamannic incursion into Italy, Aurelian began a new wall around Rome, a sign of how insecure the heartland had become.', figures: [aurelian], places: [rome], lesson: third-century-crisis, certainty: established}
- {id: aurelian-reunites, title: 'Aurelian reunites the empire', date: {from: 274}, themes: [political, military], weight: 2, summary: 'With the defeat of the Gallic emperor Tetricus, Aurelian ruled the whole empire and was hailed "restorer of the world".', causes: [gallic-empire, palmyrene-revolt], figures: [aurelian], lesson: third-century-crisis, certainty: established}
- {id: debasement-260s, title: 'Collapse of the silver coinage', date: {from: 255, to: 275, circa: true}, themes: [economic], weight: 2, summary: 'The silver content of the antoninianus fell to a few per cent, and prices rose sharply in Egypt in the 270s. The fiscal strain of war and pay was being paid for by debasement.', causes: [severan-army], lesson: third-century-crisis, certainty: established}
